<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flagged Notes Tracker — Thrive Peer Support Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --thrive-blue:#3c50a0; --thrive-blue-deep:#283c8c; --thrive-blue-dark:#1a2861;
  --thrive-yellow:#f0c814; --thrive-pink:#c83c8c; --thrive-green:#3cb43c;
  --bg:#f7f3ec; --paper:#ffffff; --ink:#1a2861; --ink-soft:#3e4a78;
  --muted:#8089a8; --rule:#e6dfd2; --rule-strong:#cdc4b2;
  --good:#2d8c30; --good-bg:#dcf0dc;
  --warn:#a07e0a; --warn-bg:#fbf0c4;
  --bad:#a52d6d; --bad-bg:#f7dde6;
  --esc:#5B3A8C; --esc-bg:#EFE7F7;
  --shadow:0 1px 0 rgba(40,60,140,.04), 0 8px 28px -12px rgba(40,60,140,.22);
  --radius-lg:14px; --radius:10px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:1px}

.topbar{background:linear-gradient(95deg, var(--thrive-blue-deep) 0%, var(--thrive-blue) 100%);color:#f5f1e8;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--thrive-yellow);position:sticky;top:0;z-index:100;}
.topbar .badge{font-family:'Fraunces',serif;font-style:italic;font-size:16px;color:#fff;font-weight:400;}
.topbar .badge .sep{color:rgba(255,255,255,.4);font-style:normal;margin:0 8px;}
.topbar .badge .sub{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:11px;letter-spacing:.08em;color:#cdd4f0;text-transform:uppercase;}
.topbar .who{font-size:12.5px;color:#dde3f7;text-align:right;line-height:1.5;}
.topbar .who strong{color:#fff;font-weight:600;}
.topbar .who .scope{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#aab4e0;}
.signout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:var(--radius-sm);padding:6px 13px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;cursor:pointer;margin-left:10px;letter-spacing:.03em;}
.signout-btn:hover{background:rgba(255,255,255,.18);}
.content{max-width:1080px;margin:0 auto;padding:24px 24px 60px;}

/* login */
.login-wrap{max-width:400px;margin:100px auto;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:36px;}
.login-wrap .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--thrive-blue);font-weight:600;margin-bottom:6px;}
.login-wrap h2{font-family:'Fraunces',serif;font-weight:400;font-size:24px;color:var(--ink);margin-bottom:8px;letter-spacing:-0.02em;}
.login-wrap p{font-size:12.5px;color:var(--muted);margin-bottom:22px;line-height:1.55;}
.login-wrap label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;margin-top:16px;text-transform:uppercase;letter-spacing:.06em;}
.login-wrap input{width:100%;border:1.5px solid var(--rule-strong);border-radius:var(--radius-sm);padding:10px 13px;font-size:13.5px;color:var(--ink);font-family:inherit;background:#fdfbf6;}
.login-wrap input:focus{outline:none;border-color:var(--thrive-yellow);}
.login-btn{width:100%;margin-top:20px;padding:12px;background:var(--thrive-blue);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;}
.login-btn:hover{background:var(--thrive-blue-deep);}
.login-btn:disabled{background:#AEB6BE;cursor:not-allowed;}
.login-error{margin-top:14px;font-size:12.5px;color:var(--bad);background:var(--bad-bg);border:1px solid #e6b8cf;border-radius:var(--radius-sm);padding:11px 13px;display:none;line-height:1.5;}
.login-error.visible{display:block;}

/* KPI strip */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);border-left:5px solid var(--thrive-blue);padding:16px 20px;box-shadow:var(--shadow);}
.kpi.bad{border-left-color:var(--bad);}
.kpi.warn{border-left-color:var(--warn);}
.kpi.esc{border-left-color:var(--esc);}
.kpi .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
.kpi .val{font-family:'Fraunces',serif;font-size:28px;font-weight:400;letter-spacing:-0.02em;color:var(--ink);line-height:1.1;}
.kpi.bad .val{color:var(--bad);}
.kpi.warn .val{color:var(--warn);}
.kpi.esc .val{color:var(--esc);}

/* filters */
.filter-bar{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:6px;margin-bottom:20px;flex-wrap:wrap;box-shadow:var(--shadow);}
.filter-tab{padding:9px 14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;color:var(--ink-soft);border:1px solid transparent;border-radius:var(--radius-sm);}
.filter-tab.active{color:#fff;background:var(--thrive-blue);border-color:var(--thrive-blue);}
.filter-tab:hover:not(.active){color:var(--ink);background:var(--bg);border-color:var(--rule);}
.filter-spacer{flex:1;}
.refresh-btn{padding:9px 16px;border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--rule-strong);background:var(--paper);color:var(--ink-soft);}
.refresh-btn:hover{border-color:var(--thrive-blue);color:var(--thrive-blue);background:var(--bg);}
.range-select{padding:8px 10px;border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;border:1.5px solid var(--rule-strong);background:var(--paper);color:var(--ink-soft);cursor:pointer;}
.range-select:hover{border-color:var(--thrive-blue);color:var(--thrive-blue);}

/* cards */
.note-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);}
.note-card.concern{border-left:5px solid var(--bad);}
.note-card.itp{border-left:5px solid var(--warn);}
.note-card.reviewed{opacity:0.6;}
.note-top{padding:18px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);}
.note-meta{font-size:13px;color:var(--ink-soft);line-height:1.7;}
.note-meta .client{font-weight:700;font-size:15px;color:var(--ink);font-family:'IBM Plex Mono',monospace;}
.note-meta .divider{color:var(--muted);margin:0 6px;}
.badge-row{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:'IBM Plex Mono',monospace;border:1px solid rgba(0,0,0,.05);}
.badge-concern{background:var(--bad-bg);color:var(--bad);}
.badge-itp{background:var(--warn-bg);color:var(--warn);}
.badge-other{background:#e8ebf6;color:var(--thrive-blue);}
.badge-reviewed{background:var(--good-bg);color:var(--good);}
.badge-rejected{background:var(--bad-bg);color:var(--bad);}
.badge-escalated{background:var(--esc-bg);color:var(--esc);}
.badge-director-escalated{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);}
.reject-reason-box{font-size:12px;color:var(--bad);background:var(--bad-bg);border-radius:var(--radius-sm);padding:9px 12px;margin-top:10px;border:1px solid #e6b8cf;}
.concern-types{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.concern-types span{display:inline-block;background:var(--bg);color:var(--ink-soft);font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid var(--rule);}
.note-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.action-row{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:160px;}
.action-btn{padding:9px 18px;border:none;border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.action-btn.approve{background:var(--good);color:#fff;}
.action-btn.approve:hover{background:#246623;}
.action-btn.reject{background:var(--paper);color:var(--bad);border:1.5px solid #e6b8cf;}
.action-btn.reject:hover{background:var(--bad-bg);}
.action-btn.escalate{background:var(--paper);color:var(--esc);border:1.5px solid #d3c2ea;}
.action-btn.escalate:hover{background:var(--esc-bg);}
.action-btn:disabled{opacity:0.5;cursor:not-allowed;}
.escalated-tag{font-size:11.5px;font-weight:700;color:var(--esc);margin-top:8px;font-family:'IBM Plex Mono',monospace;}
.escalated-tag.director{color:var(--thrive-blue);}
.reviewed-note{font-size:11.5px;color:var(--good);text-align:right;font-family:'IBM Plex Mono',monospace;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state p{font-size:14px;}
.loading-state{text-align:center;padding:40px;color:var(--muted);font-size:13px;font-family:'IBM Plex Mono',monospace;}

/* note content -- collapsed by default; the toggle button below opens it */
.note-content{padding:20px 22px;background:var(--bg);}
.note-content .field-block{margin-bottom:16px;}
.note-content .field-block:last-child{margin-bottom:0;}
.note-content .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--thrive-blue);margin-bottom:6px;}
.note-content p{font-size:13.5px;color:var(--ink);line-height:1.65;white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow);}
.collapse-toggle{background:var(--paper);border:1.5px solid var(--rule-strong);color:var(--thrive-blue);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;padding:8px 15px;margin-top:12px;border-radius:var(--radius-sm);letter-spacing:.02em;text-transform:uppercase;}
.collapse-toggle:hover{color:#fff;background:var(--thrive-blue);border-color:var(--thrive-blue);}

.email-block{border-top:1px solid var(--rule);margin-top:18px;padding-top:16px;}
.email-block label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
.email-block textarea{width:100%;border:1.5px solid var(--rule-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;min-height:52px;margin-bottom:9px;background:var(--paper);}
.email-btn{padding:9px 18px;background:var(--thrive-yellow);color:var(--thrive-blue-dark);border:none;border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;}
.email-btn:hover{filter:brightness(.94);}
.email-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
.no-note-text{font-size:12.5px;color:var(--muted);font-style:italic;padding:8px 0;}
.partial-note-text{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px;border:1px solid #e6d38a;}
.no-email-note{font-size:12.5px;color:var(--muted);padding:8px 0;}

@media print{ .filter-bar, .action-row, .refresh-btn, .signout-btn{ display:none !important; } }

/* mode toggle */
.mode-toggle{display:flex;gap:6px;margin-bottom:22px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:6px;box-shadow:var(--shadow);flex-wrap:wrap;}
.mode-tab{padding:10px 18px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;color:var(--ink-soft);border:1px solid transparent;border-radius:var(--radius-sm);}
.mode-tab.active{color:#fff;background:var(--thrive-blue);border-color:var(--thrive-blue);}
.mode-tab .count{display:inline-block;margin-left:6px;background:var(--rule);color:var(--ink-soft);border-radius:6px;padding:1px 7px;font-size:10.5px;}
.mode-tab.active .count{background:var(--thrive-yellow);color:var(--thrive-blue-dark);}
.mode-tab:hover:not(.active){color:var(--ink);background:var(--bg);border-color:var(--rule);}

/* Leadership dashboard */
.lead-section{margin-bottom:32px;}
.lead-section-title{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:4px;letter-spacing:-0.01em;}
.lead-section-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.lead-table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.lead-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--rule);background:var(--bg);}
.lead-table td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--rule);color:var(--ink);}
.lead-table tr:last-child td{border-bottom:none;}
.lead-table td.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
.lead-table tr.high-risk td{background:var(--bad-bg);}
.bar-track{background:var(--rule);border-radius:2px;height:8px;width:100%;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;}
.bar-fill.ok{background:var(--good);}
.bar-fill.warn{background:var(--warn);}
.bar-fill.bad{background:var(--bad);}
.month-row{display:flex;align-items:center;gap:12px;padding:6px 0;}
.month-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);width:70px;flex-shrink:0;}
.month-bars{flex:1;display:flex;gap:3px;height:16px;}
.month-bar-seg{border-radius:1px;}
.month-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);width:100px;text-align:right;flex-shrink:0;}
.legend-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.lead-note{font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:13px 15px;line-height:1.6;}
.aging-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:13px;}
.aging-item:last-child{border-bottom:none;}
.aging-days{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--bad);}
.aging-days.ok{color:var(--good);}
.resolved-tag{font-size:11px;color:var(--good);font-family:'IBM Plex Mono',monospace;}

/* pattern cards */
.pattern-intro{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;line-height:1.6;}
.pattern-intro strong{color:var(--ink);}
.pattern-card{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--thrive-blue);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow);}
.pattern-card.graduation{border-left-color:var(--good);}
.pattern-card.disengagement{border-left-color:var(--warn);}
.pattern-card.repeat_safety{border-left-color:var(--bad);}
.pattern-card.repeat_itp{border-left-color:var(--esc);}
.pattern-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.pattern-meta{flex:1;min-width:0;}
.ack-btn{flex-shrink:0;}
.pattern-meta .client{font-weight:700;font-size:15px;color:var(--ink);font-family:'IBM Plex Mono',monospace;}
.pattern-meta .divider{color:var(--muted);margin:0 6px;}
.pattern-label{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:'IBM Plex Mono',monospace;}
.pattern-label.graduation{background:var(--good-bg);color:var(--good);}
.pattern-label.disengagement{background:var(--warn-bg);color:var(--warn);}
.pattern-label.repeat_safety{background:var(--bad-bg);color:var(--bad);}
.pattern-label.repeat_itp{background:var(--esc-bg);color:var(--esc);}
.pattern-evidence{margin-top:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.pattern-evidence li{margin-bottom:3px;}
.pattern-evidence ul{margin-left:18px;}
.ack-btn{padding:8px 16px;border:1.5px solid var(--rule-strong);background:var(--paper);color:var(--ink-soft);border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.ack-btn:hover{border-color:var(--thrive-blue);color:var(--thrive-blue);}
.ack-btn:disabled{opacity:0.5;cursor:not-allowed;}
.pattern-count-note{font-size:11.5px;color:var(--muted);margin-bottom:14px;font-family:'IBM Plex Mono',monospace;}
/* Coaching scorecard (Sarah's 10/26 feedback) */
.flag-explainer{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;box-shadow:var(--shadow);}
.flag-explainer summary{cursor:pointer;font-weight:600;color:var(--ink);}
.flag-explainer ul{margin:8px 0 4px 18px;}
.flag-explainer li{margin-bottom:4px;}
.scorecard-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.scorecard-toolbar label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
.lead-table tr.clickable{cursor:pointer;}
.lead-table tr.clickable:hover td{background:var(--bg);}
.lead-table tr.high-risk.clickable:hover td{filter:brightness(0.97);}
.reason-list{font-size:11.5px;color:var(--bad);margin-top:3px;line-height:1.45;}
.focus-cell{font-size:12px;color:var(--ink-soft);}
.team-pattern{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin:2px 4px 2px 0;}
.view-link{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--thrive-blue);white-space:nowrap;}
.list-count{font-size:11.5px;color:var(--muted);margin:-8px 0 12px;font-family:'IBM Plex Mono',monospace;}
.similar-list{font-size:11.5px;color:var(--warn);margin-top:6px;line-height:1.5;}
.table-scroll{overflow-x:auto;}
.handled-toggle{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;padding:0 8px;cursor:pointer;}
.nc .nc-head{padding:14px 20px 4px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.nc-title{font-size:14px;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.nc-title .client{font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:14px;}
.nc-dot{color:var(--muted);margin:0 8px;}
.nc-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.nc-status{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.nc-why{padding:6px 20px 0;display:flex;gap:6px;flex-wrap:wrap;}
.why-chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;}
.why-risk{background:var(--bad-bg);color:var(--bad);}
.why-warn{background:var(--warn-bg);color:var(--warn);}
.why-info{background:#e8ebf6;color:var(--thrive-blue);}
.why-ok{background:var(--bg);color:var(--muted);}
.nc-actions{padding:12px 20px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.nc-btn{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;border:1.5px solid transparent;background:none;white-space:nowrap;list-style:none;}
.nc-btn.approve{background:var(--good);color:#fff;}
.nc-btn.approve:hover{background:#246623;}

let currentReviewer = null; // { name, role, divisions }

let currentFlagFilter = 'all';
let currentEscFilter = 'to_me';      // Escalated to Me view: to_me | clinical | ur (last two org-wide only)

let expandedCards = {};               // note id -> true when "Review note" is open
let selectedIds = {};                 // note id -> true for bulk approve

function fmtLastSynced(dt){
  if(!dt) return 'not yet synced';
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' at '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

const app = document.getElementById('app');

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// ── ROSTER / SUPERVISION SCOPE ──
// A reviewer with role 'org_wide' (e.g. Muneera) sees everything. Anyone else
// (a division director/manager) sees only notes for the providers listed as
// theirs in the `roster` table -- set up and maintained in Supabase, not in
// this file. Returns null for "no restriction" or an array of provider_emails.
function scopedProviderEmails() {
  return (currentReviewer && currentReviewer.role === 'org_wide') ? null : ((currentReviewer && currentReviewer.supervisedProviders) || []);
}

// Three levels of scope, all driven by the `roster` table:
//   manager  -- roster.manager_id = me   -> sees only their own team
//   director -- roster.director_id = me  -> sees every team under them
//   org_wide -- reviewers.role            -> sees everything
// A person can be both (a director who also directly supervises a team).
async function attachRosterScope(reviewer, userId) {
  reviewer.managerByProvider = {};  // lowercased provider_email -> manager name
  reviewer.directorByProvider = {}; // lowercased provider_email -> director name
  reviewer.nameByProvider = {};     // lowercased provider_email -> coach name (roster.provider_name)
  reviewer.isDirector = false;
  if (reviewer.role === 'org_wide') {
    reviewer.supervisedProviders = null;
    reviewer.isDirector = true;
    await loadManagerDirectory(reviewer, null);
    return;
  }
  var res = await sb.from('roster').select('*')
    .or('manager_id.eq.' + userId + ',director_id.eq.' + userId);
  if (res.error && /director_id/.test(res.error.message || '')) {
    // roster.director_id hasn't been added yet (SETUP.md) -- manager scope only.
    res = await sb.from('roster').select('provider_email, manager_id').eq('manager_id', userId);
  }
  if (res.error) {
    console.error('Could not load roster/supervision scope', res.error);
    // Fail closed: if we can't tell what this reviewer should see, show
    // nothing rather than risk showing another division's notes.
    reviewer.supervisedProviders = [];
    return;
  }
  var rows = res.data || [];
  // Lowercased: notes and roster are normalized to lowercase in Supabase
  // (roster_import.sql), and .in() matches exactly.
  reviewer.supervisedProviders = rows.map(function(r){ return r.provider_email ? String(r.provider_email).trim().toLowerCase() : null; }).filter(Boolean);
  reviewer.isDirector = rows.some(function(r){ return r.director_id === userId; });
  await fillPeopleMaps(reviewer, rows);
}

// Org-wide reviewers get the full roster so Manager/Director columns and
// filters work everywhere. Best-effort: if RLS blocks reading the roster or
// reviewers table, those columns just say "No manager on roster".
async function loadManagerDirectory(reviewer) {
  var rosterRes = await fetchAllRows(function(from, to) {
    return sb.from('roster').select('*')
      .order('provider_email', { ascending: true })
      .order('manager_id', { ascending: true })
      .range(from, to);
  });
  if (rosterRes.error) { console.warn('Could not load roster for Manager column', rosterRes.error); return; }
  await fillPeopleMaps(reviewer, rosterRes.data || []);
}

async function fillPeopleMaps(reviewer, rows) {
  var ids = {};
  rows.forEach(function(r){ if (r.manager_id) ids[r.manager_id] = true; if (r.director_id) ids[r.director_id] = true; });
  var nameById = {};
  var idList = Object.keys(ids);
  if (idList.length) {
    var revRes = await sb.from('reviewers').select('id, name').in('id', idList);
    if (revRes.error) console.warn('Could not load reviewer names', revRes.error);
    else (revRes.data || []).forEach(function(r){ nameById[r.id] = r.name; });
  }
  rows.forEach(function(r) {
    if (!r.provider_email) return;
    var k = r.provider_email.toLowerCase();
    reviewer.managerByProvider[k] = nameById[r.manager_id] || 'Unknown manager';
    if (r.director_id) reviewer.directorByProvider[k] = nameById[r.director_id] || 'Unknown director';
    if (r.provider_name) reviewer.nameByProvider[k] = r.provider_name;
  });
}

// Coach display name: roster.provider_name when set (3_coach_names.sql),
// otherwise a readable version of the email.
function coachName(email) {
  if (!email) return 'No coach email';
  var k = String(email).trim().toLowerCase();
  var map = (currentReviewer && currentReviewer.nameByProvider) || {};
  if (map[k]) return map[k];
  return k.split('@')[0];
}

function sameName(a, b) {
  return !!a && !!b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
}

// ── ESCALATED TO ME ──
// "To Me": Escalate-to-Director items routed to this reviewer (by the name
// stored at escalation time, or by being the provider's roster director).
// Org-wide reviewers also get the Clinical Director and Utilization Review queues.
function escalatedToMe(n) {
  if (!n.director_escalated || !currentReviewer) return false;
  if (sameName(n.director_escalated_to, currentReviewer.name)) return true;
  var dir = currentReviewer.directorByProvider && currentReviewer.directorByProvider[String(n.provider_email || '').toLowerCase()];
  return sameName(dir, currentReviewer.name);
}
function isEscalationOpen(n) {
  if (currentEscFilter === 'clinical') return n.escalated && !n.resolved;
  if (currentEscFilter === 'ur') return n.ur_referred && !n.ur_resolved;
  return escalatedToMe(n) && !n.director_escalated_ack;
}
function matchesEscFilter(n) {
  if (currentEscFilter === 'clinical') return !!n.escalated;
  if (currentEscFilter === 'ur') return !!n.ur_referred;
  return escalatedToMe(n);
}
function openEscalationsToMeCount() {
  return allNotes.filter(function(n){ return escalatedToMe(n) && !n.director_escalated_ack; }).length;
}

function managerFor(email) {
  if (!email) return 'No manager on roster';
  var map = (currentReviewer && currentReviewer.managerByProvider) || {};
  return map[String(email).toLowerCase()] || 'No manager on roster';
}

// ══════════════════════════════════════════════════════════════════
// COACHING FLAGS (added 10/29/26 from Sarah's feedback)
// A "flag" on the Provider Scorecard now means a documentation pattern
// worth a coaching conversation -- NOT that the PRS self-reported a
// safety concern or an ITP update. Those are the PRS doing their job and
// stay visible (badges, filters, Safety Trend tab), but they no longer
// inflate a provider's flag rate. Every threshold lives in COACHING below
// so the "How flags work" explainer on the page can't drift from the math.
// ══════════════════════════════════════════════════════════════════
var COACHING = {
  windowDays: 90,        // scorecard looks at the last 90 days of notes
  minNotes: 5,           // below this, rates are too noisy to mark a provider
  minGraded: 5,          // need at least this many graded notes to judge documentation quality
  docRate: 0.30,         // 30%+ of graded notes Needs Improvement / Non-Compliant
  repeatRate: 0.30,      // 30%+ of notes closely match another note for the same client
  crossClientMin: 1,     // any note closely matching a DIFFERENT client's note
  aiOnlyMin: 2,          // 2+ safety concerns the AI caught that the PRS didn't self-report
  teamShare: 0.5         // a theme is a "team pattern" when 2+ providers AND half the manager's team share it
};

// Near-duplicate text detection. Compares each note against the same
// provider's other notes within SIM_WINDOW_DAYS, using 3-word-phrase overlap
// (Jaccard). Checks the whole note and also Assessment+Plan on their own,
// since a PRS can vary the session description but paste the same
// Assessment/Plan every week -- the "comfort zone" pattern.
var SIM_THRESHOLD = 0.5;   // 50%+ of 3-word phrases shared
var SIM_MIN_WORDS = 25;    // shorter text is too short to compare meaningfully
var SIM_WINDOW_DAYS = 90;

function textShingles(text) {
  if (!text) return null;
  var words = String(text).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
  if (words.length < SIM_MIN_WORDS) return null;
  var set = new Set();
  for (var i = 0; i + 2 < words.length; i++) set.add(words[i] + ' ' + words[i + 1] + ' ' + words[i + 2]);
  return set;
}

function jaccard(a, b) {
  if (!a || !b) return 0;
  var small = a.size <= b.size ? a : b, big = small === a ? b : a;
  if (small.size / big.size < SIM_THRESHOLD) return 0; // can't reach threshold -- skip the work
  var inter = 0;
  small.forEach(function(s){ if (big.has(s)) inter++; });
  return inter / (a.size + b.size - inter);
}

function computeNoteSimilarity(notes) {
  var byProvider = {};
  notes.forEach(function(n) {
    if (!n.provider_email || !n.session_date) return;
    // BH Linkage contacts (U/G-code) are legitimately templated -- only compare standard notes.
    if (n.note_type && n.note_type !== 'standard') return;
    var full = textShingles([n.description_text, n.assessment_text, n.plan_text].filter(Boolean).join(' '));
    var ap = textShingles([n.assessment_text, n.plan_text].filter(Boolean).join(' '));
    if (!full && !ap) return;
    var k = n.provider_email.toLowerCase();
    (byProvider[k] = byProvider[k] || []).push({ n: n, full: full, ap: ap, t: new Date(n.session_date + 'T00:00:00').getTime() });
  });
  var result = {};
  var windowMs = SIM_WINDOW_DAYS * 86400000;
  function add(from, to, sim, cross) {
    (result[from.id] = result[from.id] || []).push({ id: to.id, date: to.session_date, client: to.client_number, sim: sim, crossClient: cross });
  }
  Object.keys(byProvider).forEach(function(k) {
    var arr = byProvider[k].sort(function(a, b){ return a.t - b.t; });
    for (var i = 0; i < arr.length; i++) {
      for (var j = i + 1; j < arr.length && (arr[j].t - arr[i].t) <= windowMs; j++) {
        var a = arr[i].n, b = arr[j].n;
        // Same client + same date is almost always a re-submitted entry, not a pattern.
        if (a.client_number && a.client_number === b.client_number && a.session_date === b.session_date) continue;
        var sim = Math.max(jaccard(arr[i].full, arr[j].full), jaccard(arr[i].ap, arr[j].ap));
        if (sim < SIM_THRESHOLD) continue;
        var cross = !!(a.client_number && b.client_number && a.client_number !== b.client_number);
        add(a, b, sim, cross);
        add(b, a, sim, cross);
      }
    }
  });
  return result;
}

function isDocQualityFlag(n) {
  return n.compliance_grade === 'Needs Improvement' || n.compliance_grade === 'Non-Compliant';
}

// Note-level coaching flags. Returns an array of theme keys.
function noteCoachingFlags(n, simMap) {
  var flags = [];
  if (isDocQualityFlag(n)) flags.push('doc_quality');
  var m = simMap && simMap[n.id];
  if (m && m.some(function(x){ return !x.crossClient; })) flags.push('repetitive');
  if (m && m.some(function(x){ return x.crossClient; })) flags.push('cross_client');
  if (n.ai_concern_flagged && !n.concern_flagged) flags.push('ai_only');
  return flags;
}

var COACHING_THEMES = {
  individualization: 'Individualization',
  goal_link: 'Goal link to treatment plan',
  scope: 'Scope of practice',
  progress: 'Progress / skill-building',
  plan: 'Forward plan',
  repetitive: 'Repetitive language',
  cross_client: 'Possible copy-paste between clients',
  ai_only: 'Safety concern not self-reported',
  other: 'Other documentation'
};

// Maps a compliance_issues string to a theme. New grades come back tagged
// ("[Goal Link] ...") per the updated rubric; older untagged grades fall
// back to keywords, which is approximate.
function issueTheme(issue) {
  var s = String(issue || '').toLowerCase();
  var tag = s.match(/^\s*\[([^\]]+)\]/);
  if (tag) {
    var t = tag[1];
    if (t.indexOf('individual') >= 0) return 'individualization';
    if (t.indexOf('goal') >= 0) return 'goal_link';
    if (t.indexOf('scope') >= 0) return 'scope';
    if (t.indexOf('progress') >= 0) return 'progress';
    if (t.indexOf('plan') >= 0) return 'plan';
  }
  if (/goal|treatment plan|\bitp\b/.test(s)) return 'goal_link';
  if (/scope|clinical|therap|diagnos|symptom|case management/.test(s)) return 'scope';
  if (/next step|continue services|follow-up|follow up|forward plan|vague plan/.test(s)) return 'plan';
  if (/progress|measurable|movement|skill|setback/.test(s)) return 'progress';
  if (/generic|templat|individual|boilerplate|could apply|swap|copied/.test(s)) return 'individualization';
  return 'other';
}

function topThemes(themeCounts, n) {
  return Object.keys(themeCounts)
    .filter(function(k){ return themeCounts[k] > 0; })
    .sort(function(a, b){ return (themeCounts[b] - themeCounts[a]) || (a === 'other' ? 1 : b === 'other' ? -1 : 0); })
    .slice(0, n || 2);
}

// Applies roster scoping to a notes-table query builder. Returns null if the
// caller should short-circuit to an empty result (a manager with no roster
// entries yet) instead of making a request.
function scopeNotesQuery(query) {
  var emails = scopedProviderEmails();
  if (emails === null) return query;
  if (!emails.length) return null;
  return query.in('provider_email', emails);
}

// FIX (9/30/26): Supabase/PostgREST caps any single select() response at
// 1000 rows by default -- silently, with no error -- so every unpaginated
// query against a table this size (3,400+ notes in just the last 90 days)
// was truncating both "Total Notes (in view)" and "Needs Review" at exactly
// 1000, hiding roughly two-thirds of real notes from review. This pages
// through in batches of 1000 using .range() until a page comes back short.
//
// buildQuery(from, to) must build and return a FRESH query builder each call
// (a Supabase builder can't be re-awaited or rewound after use) with
// .range(from, to) applied as the last step. Ordering must be fully
// deterministic (a unique tie-breaker column, not just session_date, which
// many notes share) or rows can be skipped or duplicated across page
// boundaries.
async function fetchAllRows(buildQuery, pageSize) {
  pageSize = pageSize || 1000;
  var allRows = [];
  var offset = 0;
  while (true) {
    var page = await buildQuery(offset, offset + pageSize - 1);
    if (page.error) return { data: null, error: page.error };
    var rows = page.data || [];
    allRows = allRows.concat(rows);
    if (rows.length < pageSize) break;
    offset += pageSize;
  }
  return { data: allRows, error: null };
}

// Shared definition of "this note has a flag worth someone's attention" --
// used both for the note card's border/color and for the Routine filter, so
// the two never drift out of sync.
// A note written under an email that no manager owns -- a personal email,
// a typo, or someone missing from the roster. No manager can see these, so
// they surface in the Flagged queue for org-wide reviewers (the directors).
var WORK_EMAIL_DOMAIN = '@thrivepeersupport.com';
function isUnknownAuthor(n) {
  if (!currentReviewer || currentReviewer.role !== 'org_wide') return false;
  var e = String(n.provider_email || '').trim().toLowerCase();
  if (!e || e.slice(-WORK_EMAIL_DOMAIN.length) !== WORK_EMAIL_DOMAIN) return true;
  var map = currentReviewer.managerByProvider || {};
  return Object.keys(map).length > 0 && !map[e];
}

function noteHasAnyFlag(n) {
  return isUnknownAuthor(n) || !!(n.concern_flagged || n.ai_concern_flagged || n.itp_flagged
    || isDocQualityFlag(n) || (noteSimilarity[n.id] && noteSimilarity[n.id].length));
}

// ══════════════════════════════════════════════════════════════════
// TRIAGE (10/29/26)
// Nobody can read every note. Every note is scanned (safety scan at
// submission, documentation grade + repetition check here), and only notes
// that come back flagged land in a manager's Needs Review queue. Routine
// notes stay viewable under All Notes but never ask for action.
// ══════════════════════════════════════════════════════════════════
function isAwaitingScan(n) {
  return !n.compliance_grade && !n.compliance_graded_at && !noteHasAnyFlag(n);
}
function noteNeedsReview(n) {
  return !n.reviewed && noteHasAnyFlag(n);
}
// Lower = more urgent. Risk first, then integrity, then documentation, then ITP.
function notePriority(n) {
  var sim = noteSimilarity[n.id] || [];
  if (n.ai_concern_flagged && !n.concern_flagged) return 0;
  if (n.concern_flagged) return 1;
  if (isUnknownAuthor(n)) return 2;
  if (sim.some(function(x){ return x.crossClient; })) return 2;
  if (n.compliance_grade === 'Non-Compliant') return 3;
  if (sim.length) return 4;
  if (n.compliance_grade === 'Needs Improvement') return 5;
  if (n.itp_flagged) return 6;
  return 7;
}
function matchesFlagFilter(n) {
  switch (currentFlagFilter) {
    case 'risk': return !!(n.concern_flagged || n.ai_concern_flagged);
    case 'documentation': return isDocQualityFlag(n);
    case 'repetitive': return !!(noteSimilarity[n.id] && noteSimilarity[n.id].length);
    case 'itp': return !!n.itp_flagged;
    case 'unknown_author': return isUnknownAuthor(n);
    case 'routine': return !noteHasAnyFlag(n) && !isAwaitingScan(n);
    case 'awaiting_scan': return isAwaitingScan(n);
    default: return true;
  }
}

// What the manager should actually look at, per flag. Shown on the card so
// the reviewer is prompted toward the right content and the right next step.
function reviewPrompts(n) {
  var out = [];
  var sim = (noteSimilarity[n.id] || []).slice().sort(function(a, b){ return b.sim - a.sim; });
  var fmt = function(d){ return d ? new Date(d + 'T00:00:00').toLocaleDateString() : '?'; };
  if (n.ai_concern_flagged && !n.concern_flagged) {
    out.push({ level: 'risk', text: 'Possible risk in the narrative that the coach did not flag. Read the Description for risk language and check that a safety follow-up is documented. If risk looks active, escalate to the Clinical Director.' });
  }
  if (n.concern_flagged) {
    var types = (n.concern_type && n.concern_type.length) ? (' (' + n.concern_type.join(', ') + ')') : '';
    out.push({ level: 'risk', text: 'Coach reported a concern' + types + '. Confirm the follow-up and any safety plan are documented. Escalate to the Clinical Director if the risk is active or unresolved.' });
  }
  if (isUnknownAuthor(n)) {
    var em = String(n.provider_email || '(blank)');
    var personal = em.toLowerCase().slice(-WORK_EMAIL_DOMAIN.length) !== WORK_EMAIL_DOMAIN;
    out.push({ level: 'integrity', text: (personal
      ? 'Written under a non-work email (' + em + '). No manager can see this note. Find out who wrote it, remind them to use their Thrive email, and have their notes moved to it (SQL in roster_import.sql).'
      : 'Written by ' + em + ', who is not on the roster, so no manager can see this note. Add them to the roster under their manager.') });
  }
  var cross = sim.filter(function(x){ return x.crossClient; })[0];
  if (cross) {
    out.push({ level: 'integrity', text: 'Wording closely matches client ' + (cross.client || '?') + '’s note from ' + fmt(cross.date) + ' (' + Math.round(cross.sim * 100) + '%). Confirm this note reflects this client’s session; if not, send it back to the coach.' });
  }
  var same = sim.filter(function(x){ return !x.crossClient; })[0];
  if (same) {
    out.push({ level: 'coaching', text: 'Repeats this client’s note from ' + fmt(same.date) + ' (' + Math.round(same.sim * 100) + '%). Is the client moving toward their goals, or is the note being carried forward? Good for a coaching conversation; refer to Utilization Review if services may not be helping the client move forward.' });
  }
  if (isDocQualityFlag(n)) {
    out.push({ level: 'coaching', text: 'Documentation graded ' + n.compliance_grade + ' (issues below). Send back to the coach if it needs revision before audit or billing.' });
  }
  if (n.itp_flagged) {
    out.push({ level: 'info', text: 'Coach flagged an ITP update. Confirm the treatment plan update is scheduled. Refer to Utilization Review if the level of care may need to change.' });
  }
  return out;
}

async function loadAndRenderDashboard() {
  // renderShell rebuilds the whole page, including resetting the
  // Leadership Dashboard and Caseload Patterns tabs back to their static
  // "Loading..." placeholder. Their load-guards must reset here too, or
  // revisiting those tabs after any note action (approve/reject/escalate/
  // grade/refresh) shows a stuck placeholder that never actually reloads.
  patternsLoaded = false;
  leadershipLoaded = false;

  renderShell(true);

  // General note oversight: every submitted note loads, not just flagged
  // ones. Concern/ITP/compliance flags are filters and badges on top of the
  // full list now, rather than a gate on what appears at all.
  //
  // Date-range window keeps the day-to-day list from growing unbounded now
  // that everything loads -- but it NEVER hides a note still needing review,
  // no matter how old: "reviewed=false OR within the window", not just
  // "within the window". Only already-closed-out old notes drop out of view.
  var cutoffStr = null;
  if (currentDateRangeDays !== 'all') {
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - currentDateRangeDays);
    cutoffStr = cutoff.toISOString().slice(0, 10);
  }

  function buildNotesQuery() {
    // .order() on id too: session_date alone isn't unique (many notes share
    // a day), and .range() pagination needs a fully deterministic sort or
    // rows can be skipped/duplicated across page boundaries.
    var q = sb.from(TABLE).select('*')
      .order('session_date', { ascending: false })
      .order('id', { ascending: false });
    if (cutoffStr) {
      // Everything in the window, plus older notes that are still open AND
      // flagged (or escalated). Routine unreviewed notes outside the window
      // no longer load -- they were never going to be reviewed, and pulling
      // every one since go-live made "Needs Review" an impossible number.
      q = q.or('session_date.gte.' + cutoffStr
        + ',director_escalated.eq.true,escalated.eq.true'
        + ',and(reviewed.eq.false,or(concern_flagged.eq.true,ai_concern_flagged.eq.true,itp_flagged.eq.true,compliance_grade.in.("Needs Improvement","Non-Compliant")))');
    }
    return scopeNotesQuery(q);
  }

  if (!buildNotesQuery()) {
    // No roster entries for this reviewer yet -- nothing to show.
    allNotes = [];
    renderShell(false);
    return;
  }

  var { data, error } = await fetchAllRows(function(from, to) {
    return buildNotesQuery().range(from, to);
  });

  if (error) {
    document.getElementById('notesList').innerHTML = '<div class="empty-state"><p>Error loading notes: ' + escapeHtml(error.message) + '</p></div>';
    return;
  }

  allNotes = data || [];
  noteSimilarity = computeNoteSimilarity(allNotes);
  lastSyncedAt = new Date();
  if (!landingChosen) {
    // Home screen: directors with something escalated land there; everyone
    // else lands on their Review Queue.
    landingChosen = true;
    currentMode = (currentReviewer.isDirector && openEscalationsToMeCount() > 0) ? 'escalated' : 'flagged';
  }
  renderShell(false);
  autoScanInBackground();
}

// Manager + Provider dropdowns for Note Review. Manager only shows for
// org-wide reviewers (everyone else's scope is a single team already).
function renderPeopleFilterSelects() {
  var managers = {}, providers = {};
  allNotes.forEach(function(n) {
    if (!n.provider_email) return;

    if (currentManagerFilter === 'all' || mgr === currentManagerFilter) providers[n.provider_email.toLowerCase()] = true;
  });
  if (currentProviderFilter !== 'all') providers[currentProviderFilter] = true; // keep a drill-down selection visible
  var html = '';
  if (currentReviewer && currentReviewer.isDirector) {
    html += '<select class="range-select" id="managerFilterSelect" title="Filter by manager">'
      + '<option value="all">All managers</option>'

      + '</select>';

  html += '<select class="range-select" id="providerFilterSelect" title="Filter to one provider">'

    + Object.keys(providers).sort(function(a, b){ return coachName(a).localeCompare(coachName(b)); }).map(function(p){ return '<option value="' + escapeHtml(p) + '"' + (p === currentProviderFilter ? ' selected' : '') + '>' + escapeHtml(coachName(p)) + '</option>'; }).join('')

function queueCount(q) {
  return allNotes.filter(function(n){
    if (q === 'unreviewed') return noteNeedsReview(n);
    if (q === 'sent_back') return n.reviewed && n.review_outcome === 'rejected';
    if (q === 'director_escalated') return n.director_escalated && !n.director_escalated_ack;
    if (q === 'escalated') return n.escalated && !n.resolved;
    if (q === 'ur') return n.ur_referred && !n.ur_resolved;
    return false;
  }).length;
}

function kpiRowHtml() {
  var count = function(fn){ return allNotes.filter(fn).length; };
  var needs = count(noteNeedsReview);
  var tc = document.getElementById('flaggedTabCount');
  if (tc) tc.innerHTML = needs ? ' <span class="count">' + needs + '</span>' : '';
  var escOpen = openEscalationsToMeCount();
  var ec = document.getElementById('escTabCount');
  if (ec) ec.innerHTML = escOpen ? ' <span class="count">' + escOpen + '</span>' : '';
  document.querySelectorAll('.qcount').forEach(function(el){
    var c = queueCount(el.getAttribute('data-q'));
    el.textContent = c ? ' ' + c : '';
  });
  var risk = count(function(n){ return !n.reviewed && (n.concern_flagged || n.ai_concern_flagged); });
  if (currentMode === 'escalated') {
    var orgWide = currentReviewer && currentReviewer.role === 'org_wide';
    return '<div class="kpi-row kpi-compact">'
      + '<div class="kpi bad"><div class="lbl">Escalated to you, open</div><div class="val">' + escOpen + '</div></div>'
      + (orgWide ? '<div class="kpi esc"><div class="lbl">Clinical Director / UR open</div><div class="val">' + count(function(n){ return n.escalated && !n.resolved; }) + ' / ' + count(function(n){ return n.ur_referred && !n.ur_resolved; }) + '</div></div>' : '')
      + '</div>';
  }
  if (currentMode === 'team') {
    var providers = {};

      + '<div class="kpi"><div class="lbl">Notes in view</div><div class="val">' + allNotes.length.toLocaleString() + '</div></div>'
      + '<div class="kpi"><div class="lbl">Coaches</div><div class="val">' + Object.keys(providers).length + '</div></div>'
      + '<div class="kpi bad"><div class="lbl">Need review</div><div class="val">' + needs + '</div></div>'
      + '</div>';
  }
  return '<div class="kpi-row kpi-compact">'
    + '<div class="kpi bad"><div class="lbl">Need review</div><div class="val">' + needs + '</div></div>'
    + '<div class="kpi bad"><div class="lbl">Potential risk, not yet reviewed</div><div class="val">' + risk + '</div></div>'
    + '</div>';
}

// Refreshes counts + list in place without rebuilding the shell (which
// would reset the Patterns/Leadership tabs).

var currentMode = 'flagged'; // flagged | escalated | team | patterns | leadership
var LIST_PAGE_SIZE = 100;
var listLimit = LIST_PAGE_SIZE;
var patternsLoaded = false;
var leadershipLoaded = false;

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab[data-mode]').forEach(function(tab){
    tab.classList.toggle('active', tab.getAttribute('data-mode') === mode);
  });
  var notesEl = document.getElementById('notesMode');
  var patternsEl = document.getElementById('patternsMode');
  var leadershipEl = document.getElementById('leadershipMode');
  if (!notesEl || !patternsEl || !leadershipEl) return;
  var isNotesView = (mode === 'team' || mode === 'flagged' || mode === 'escalated');
  var et = document.getElementById('escTabs');
  if (et) et.style.display = (mode === 'escalated') ? '' : 'none';
  notesEl.style.display = isNotesView ? 'block' : 'none';
  var qt = document.getElementById('queueTabs');
  if (qt) qt.style.display = (mode === 'flagged') ? '' : 'none';
  var tl = document.getElementById('teamViewLabel');
  if (tl) tl.style.display = (mode === 'team') ? '' : 'none';
  if (isNotesView) listLimit = LIST_PAGE_SIZE;
  var gw = document.getElementById('groupToggleWrap');
  if (gw) gw.style.display = (mode === 'flagged') ? '' : 'none';
  patternsEl.style.display = (mode === 'patterns') ? 'block' : 'none';
  leadershipEl.style.display = (mode === 'leadership') ? 'block' : 'none';

    patternsLoaded = true;
    loadCaseloadPatterns();
  }
  if (mode === 'leadership' && !leadershipLoaded) {
    leadershipLoaded = true;
    loadLeadershipDashboard();
  }
}

function renderNotesList() {
  document.querySelectorAll('.filter-tab[data-filter]').forEach(function(tab){
    tab.classList.toggle('active', tab.getAttribute('data-filter') === currentFilter);
  });
  document.querySelectorAll('.esc-tab').forEach(function(tab){
    tab.classList.toggle('active', tab.getAttribute('data-esc') === currentEscFilter);
  });

  var filtered = allNotes.filter(function(n){
    if (currentProviderFilter !== 'all' && String(n.provider_email || '').toLowerCase() !== currentProviderFilter) return false;
    if (currentManagerFilter !== 'all' && managerFor(n.provider_email) !== currentManagerFilter) return false;
    if (!matchesFlagFilter(n)) return false;
    if (currentSearch) {
      var hay = (String(n.client_number || '') + ' ' + String(n.provider_email || '') + ' ' + coachName(n.provider_email)).toLowerCase();
      if (hay.indexOf(currentSearch) < 0) return false;
    }
    if (currentMode === 'team') return true; // Team Notes: every note in scope
    if (currentMode === 'escalated') return matchesEscFilter(n) && (showHandledEscalations || isEscalationOpen(n));
    if (currentFilter === 'all_flagged') return noteHasAnyFlag(n);
    if (currentFilter === 'unreviewed') return noteNeedsReview(n);
    if (currentFilter === 'sent_back') return n.reviewed && n.review_outcome === 'rejected';
    if (currentFilter === 'director_escalated') return n.director_escalated;
    if (currentFilter === 'escalated') return n.escalated;
    if (currentFilter === 'ur') return n.ur_referred;
    return true;
  });
  if ((currentMode === 'flagged' && currentFilter === 'unreviewed') || currentMode === 'escalated') {
    filtered.sort(function(a, b){ return (notePriority(a) - notePriority(b)) || String(b.session_date || '').localeCompare(String(a.session_date || '')); });
  }

  var listEl = document.getElementById('notesList');
  var countEl = document.getElementById('listCount');
  if (countEl) {
    var who = currentProviderFilter !== 'all' ? (' for ' + currentProviderFilter) : (currentManagerFilter !== 'all' ? (' for ' + currentManagerFilter + '’s team') : '');
    var who2 = currentProviderFilter !== 'all' ? (' for ' + coachName(currentProviderFilter)) : who;
    countEl.textContent = filtered.length.toLocaleString() + ' note' + (filtered.length === 1 ? '' : 's') + who2 + (currentSearch ? ' matching \u201C' + currentSearch + '\u201D' : '');
  }
  if (filtered.length === 0) {
    updateBulkBar();
    listEl.innerHTML = '<div class="empty-state"><p>' + ((currentMode === 'flagged' && currentFilter === 'unreviewed') ? 'All caught up — no flagged notes waiting for review on your team.' : (currentMode === 'escalated' ? 'Nothing open has been escalated to you.' : 'No notes match this filter.')) + '</p></div>';
    return;
  }

  var grouped = (currentMode === 'flagged' && currentFilter === 'unreviewed' && groupByCoach);
  if (grouped && countEl) {
    var coachSet = {};
    filtered.forEach(function(n){ coachSet[String(n.provider_email || '').toLowerCase()] = true; });
    countEl.textContent += ' from ' + Object.keys(coachSet).length + ' coach' + (Object.keys(coachSet).length === 1 ? '' : 'es') + ' \u2014 click a coach to see their notes';
  }
  var html = '';
  var total = filtered.length;
  if (grouped) {
    var groups = {};
    filtered.forEach(function(n){
      var k = String(n.provider_email || '(no email)').toLowerCase();
      (groups[k] = groups[k] || []).push(n);
    });
    var keys = Object.keys(groups).sort(function(a, b){
      var pa = Math.min.apply(null, groups[a].map(notePriority)), pb = Math.min.apply(null, groups[b].map(notePriority));
      return (pa - pb) || (groups[b].length - groups[a].length);
    });
    total = keys.length;
    var shownCards = [];
    keys.slice(0, listLimit).forEach(function(k){
      var g = groups[k];
      var risk = g.filter(function(n){ return n.concern_flagged || n.ai_concern_flagged || isUnknownAuthor(n); }).length;
      var docs = g.filter(isDocQualityFlag).length;
      var rep = g.filter(function(n){ return noteSimilarity[n.id] && noteSimilarity[n.id].length; }).length;
      var open = !!expandedGroups[k];
      var allSel = g.every(function(n){ return selectedIds[n.id]; });
      html += '<div class="cg' + (open ? ' open' : '') + '">'
        + '<div class="cg-head" data-group="' + escapeHtml(k) + '">'
        + '<input type="checkbox" class="cg-check" data-group="' + escapeHtml(k) + '" title="Select all of this coach\u2019s notes"' + (allSel ? ' checked' : '') + '/>'
        + '<div class="cg-name">' + escapeHtml(coachName(k)) + '<span class="cg-mgr">' + escapeHtml(managerFor(k)) + '</span></div>'
        + '<div class="cg-chips">'
        + (risk ? '<span class="why-chip why-risk">' + risk + ' risk</span>' : '')
        + (docs ? '<span class="why-chip why-warn">' + docs + ' documentation</span>' : '')
        + (rep ? '<span class="why-chip why-warn">' + rep + ' repetitive</span>' : '')
        + '</div>'
        + '<div class="cg-count">' + g.length + ' note' + (g.length === 1 ? '' : 's') + ' <span class="cg-caret">' + (open ? '\u25B4' : '\u25BE') + '</span></div>'
        + '</div>'
        + (open ? '<div class="cg-body">' + g.map(renderNoteCard).join('') + '</div>' : '')
        + '</div>';
      if (open) shownCards = shownCards.concat(g);
    });
    if (total > listLimit) html += '<div style="text-align:center;margin:10px 0 30px;"><button class="refresh-btn" id="showMoreBtn">Show more coaches (' + (total - listLimit) + ' remaining)</button></div>';
    filtered = shownCards;
  } else {
    filtered = filtered.slice(0, listLimit);
    html = filtered.map(renderNoteCard).join('')
      + (total > filtered.length ? '<div style="text-align:center;margin:10px 0 30px;"><button class="refresh-btn" id="showMoreBtn">Show ' + Math.min(LIST_PAGE_SIZE, total - filtered.length) + ' more (' + (total - filtered.length) + ' remaining)</button></div>' : '');
  }
  listEl.innerHTML = html;
  var moreBtn = document.getElementById('showMoreBtn');
  if (moreBtn) moreBtn.onclick = function(){ listLimit += LIST_PAGE_SIZE; renderNotesList(); };
  document.querySelectorAll('.cg-head').forEach(function(h){
    h.onclick = function(e){
      if (e.target.classList.contains('cg-check')) return;
      var k = h.getAttribute('data-group');
      expandedGroups[k] = !expandedGroups[k];
      renderNotesList();
    };
  });
  document.querySelectorAll('.cg-check').forEach(function(c){
    c.onchange = function(){
      var k = c.getAttribute('data-group');
      allNotes.forEach(function(n){ if (noteNeedsReview(n) && String(n.provider_email || '(no email)').toLowerCase() === k) { if (c.checked) selectedIds[n.id] = true; else delete selectedIds[n.id]; } });
      renderNotesList();
    };
  });
  document.querySelectorAll('.nc-check').forEach(function(c){
    c.onchange = function(){ var id = c.getAttribute('data-id'); if (c.checked) selectedIds[id] = true; else delete selectedIds[id]; updateBulkBar(); };
  });
  updateBulkBar();
  filtered.forEach(function(note){
    var approveBtn = document.getElementById('approveBtn_' + note.id);
    if (approveBtn) approveBtn.onclick = function(){ resolveNote(note.id, 'approved'); };

    var rejectBtn = document.getElementById('rejectBtn_' + note.id);
    if (rejectBtn) rejectBtn.onclick = function(){ rejectNote(note); };

    var escalateDirectorBtn = document.getElementById('escalateDirectorBtn_' + note.id);
    if (escalateDirectorBtn) escalateDirectorBtn.onclick = function(){ escalateToDirector(note); };

    var escalateClinicalBtn = document.getElementById('escalateClinicalBtn_' + note.id);
    if (escalateClinicalBtn) escalateClinicalBtn.onclick = function(){ escalateToClinical(note); };

    var urBtn = document.getElementById('urBtn_' + note.id);
    if (urBtn) urBtn.onclick = function(){ referToUtilizationReview(note); };

    var urDoneBtn = document.getElementById('urDoneBtn_' + note.id);
    if (urDoneBtn) urDoneBtn.onclick = function(){ completeUtilizationReview(note); };

    var ackDirectorBtn = document.getElementById('ackDirectorBtn_' + note.id);
    if (ackDirectorBtn) ackDirectorBtn.onclick = function(){ acknowledgeDirectorEscalation(note); };

    var collapseBtn = document.getElementById('collapseToggle_' + note.id);
    var contentDiv = document.getElementById('noteContent_' + note.id);
    if (collapseBtn && contentDiv) {
      if (expandedCards[note.id]) { contentDiv.style.display = 'block'; collapseBtn.textContent = 'Hide \u25B4'; }
      collapseBtn.onclick = function(){
        var nowHidden = contentDiv.style.display !== 'none';
        if (nowHidden) delete expandedCards[note.id]; else expandedCards[note.id] = true;
        contentDiv.style.display = nowHidden ? 'none' : 'block';
        collapseBtn.textContent = nowHidden ? 'Review note \u25BE' : 'Hide \u25B4';
      };
    }

    var emailBtn = document.getElementById('emailBtn_' + note.id);
    if (emailBtn) emailBtn.onclick = function(){ emailProvider(note); };
  });
}

// Apply a saved change to the in-memory notes and redraw just the list, so
// the page doesn't reload or jump back to the top after every action.
function applyLocal(ids, fields) {
  var set = {};
  ids.forEach(function(id){ set[String(id)] = true; });
  allNotes.forEach(function(n){ if (set[String(n.id)]) Object.assign(n, fields); });
  ids.forEach(function(id){ delete selectedIds[id]; });
  leadershipLoaded = false; // dashboards recompute on next visit
  var y = window.scrollY;
  refreshNotesView();
  window.scrollTo(0, y);
}

function fadeOutCard(id) {
  var btn = document.getElementById('approveBtn_' + id) || document.getElementById('rejectBtn_' + id);
  var card = btn && btn.closest('.note-card');
  if (card) card.classList.add('nc-leaving');
  return new Promise(function(r){ setTimeout(r, card ? 220 : 0); });
}

var toastTimer = null;
function showToast(msg, undoFn) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.innerHTML = '<span>' + escapeHtml(msg) + '</span>' + (undoFn ? '<button id="toastUndo">Undo</button>' : '');
  t.className = 'show';
  var u = document.getElementById('toastUndo');
  if (u) u.onclick = function(){ t.className = ''; undoFn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = ''; }, 6000);
}

var UNREVIEW = { reviewed: false, reviewed_by: null, reviewed_date: null, review_outcome: null };
async function undoReview(ids) {
  var { error } = await sb.from(TABLE).update(UNREVIEW).in('id', ids);
  if (error) { alert('Could not undo: ' + error.message); return; }
  applyLocal(ids, UNREVIEW);
  showToast('Moved back to Needs Review');
}

async function approveIds(ids) {
  var fields = { reviewed: true, reviewed_by: currentReviewer.name, reviewed_date: new Date().toISOString(), review_outcome: 'approved' };
  var { error } = await sb.from(TABLE).update(fields).in('id', ids);
  if (error) { alert('Could not save: ' + error.message); return false; }
  applyLocal(ids, fields);
  showToast(ids.length === 1 ? 'Approved' : ids.length + ' notes approved', function(){ undoReview(ids); });
  return true;
}

function updateBulkBar() {
  var ids = Object.keys(selectedIds);
  var bar = document.getElementById('bulkBar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'bulkBar'; document.body.appendChild(bar); }
  if (!ids.length || currentMode !== 'flagged') { bar.className = ''; return; }
  bar.innerHTML = '<span>' + ids.length + ' selected</span><button id="bulkApprove">Approve selected</button><button id="bulkClear" class="ghost">Clear</button>';
  bar.className = 'show';
  document.getElementById('bulkApprove').onclick = async function(){
    if (ids.length > 5 && !confirm('Approve ' + ids.length + ' notes?')) return;
    this.disabled = true; this.textContent = 'Saving…';
    await approveIds(ids);
  };
  document.getElementById('bulkClear').onclick = function(){ selectedIds = {}; renderNotesList(); };
}

async function resolveNote(noteId, outcome) {
  var btn = document.getElementById(outcome === 'approved' ? 'approveBtn_' + noteId : 'rejectBtn_' + noteId);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  await fadeOutCard(noteId);
  var ok = await approveIds([noteId]);
  if (!ok && btn) { btn.disabled = false; btn.textContent = 'Approve'; }
}

async function rejectNote(note) {
  var reason = prompt('What does the coach need to fix? (Logged, and included in the email to the coach.)');
  if (reason === null) return;
  reason = reason.trim();

  var btn = document.getElementById('rejectBtn_' + note.id);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var rejFields = {
    reviewed: true, reviewed_by: currentReviewer.name,
    reviewed_date: new Date().toISOString(), review_outcome: 'rejected',
    reject_reason: reason || null
  };
  var { error } = await sb.from(TABLE).update(rejFields).eq('id', note.id);

  if (error) {
    alert('Could not save: ' + error.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Send Back to Coach'; }
    return;
  }

  if (note.provider_email) {
    var wantsEmail = confirm('Note sent back to the coach. Email ' + note.provider_email + ' now with what needs fixing?');
    if (wantsEmail) emailProvider(Object.assign({}, note, { _rejectReason: reason }));
  }
  applyLocal([note.id], rejFields);
  showToast('Sent back to ' + coachName(note.provider_email), function(){ undoReview([note.id]); });
}

// ── ESCALATE TO DIRECTOR: routes straight to the note's provider's actual
// supervisor via the roster table (Supabase), not a division/program guess.
// Independent of clinical escalation below -- a note can go to the director,
// to clinical, or both.
async function escalateToDirector(note) {
  var btn = document.getElementById('escalateDirectorBtn_' + note.id);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var directorName = null;
  if (note.provider_email) {
    // roster.director_id (optional column -- see SETUP.md) routes to the
    // director over the provider's manager. Without it, falls back to the
    // manager, which was the original behavior.
    var rosterRes = await sb.from('roster').select('*').eq('provider_email', String(note.provider_email).trim().toLowerCase()).maybeSingle();
    if (!rosterRes.error && rosterRes.data) {
      var targetId = rosterRes.data.director_id || rosterRes.data.manager_id;
      var mgrRes = await sb.from('reviewers').select('name, email').eq('id', targetId).single();
      if (!mgrRes.error && mgrRes.data) { directorName = mgrRes.data.name; }
    }
  }

  // No email goes out here -- setting director_escalated is what surfaces this
  // note on the director's hub tasks. director_escalated_to is kept purely as
  // a record of who the roster resolved to (useful for auditing / debugging a
  // bad roster mapping), not for addressing an email.
  var dirFields = {
    director_escalated: true, director_escalated_by: currentReviewer.name,
    director_escalated_date: new Date().toISOString(),
    director_escalated_to: directorName
  };
  var { error } = await sb.from(TABLE).update(dirFields).eq('id', note.id);

  if (error) {
    alert('Could not escalate to director: ' + error.message);
    if (btn) { btn.disabled = false; btn.textContent = 'To Director'; }
    return;
  }
  applyLocal([note.id], dirFields);
  showToast('Escalated to ' + (directorName || 'director'));
}

// A director marks an "Escalate to Director" note as seen/handled. Separate
// from Approve/Reject, since a director may want to acknowledge awareness
// before (or instead of) closing the note out.
async function acknowledgeDirectorEscalation(note) {

  showToast('Escalation acknowledged');

// ── ESCALATE TO CLINICAL: sets the `escalated` field, which is what feeds
// the Clinical Director Hub's Escalated Charts queue. Keep this field name
// exactly as-is -- the Hub reads it directly.
async function escalateToClinical(note) {

// ── UTILIZATION REVIEW: needs ur_* columns (SQL in SETUP.md). ──
function urSetupMessage(error) {
  return /ur_/.test(error.message || '')
    ? 'Utilization Review isn\'t set up in Supabase yet. Run the SQL in SETUP.md, then try again.'
    : error.message;
}

async function referToUtilizationReview(note) {
  var reason = prompt('What should Utilization Review look at? (e.g. level of care, hours vs. SLI level, no progress toward goals)');
  if (reason === null) return;
  var btn = document.getElementById('urBtn_' + note.id);

    ur_referred: true, ur_referred_by: currentReviewer.name,

  applyLocal([note.id], urFields);
  showToast('Referred to Utilization Review');

async function completeUtilizationReview(note) {
  var outcome = prompt('Utilization Review outcome (optional, e.g. "Level of care stepped down to L2"):');
  if (outcome === null) return;
  var btn = document.getElementById('urDoneBtn_' + note.id);

    alert('Could not save: ' + urSetupMessage(error));

    return;
