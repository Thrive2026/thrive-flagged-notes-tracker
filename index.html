  applyLocal([note.id], urDone);
  showToast('Utilization Review marked complete');
}

// ══════════════════════════════════════════════════════════════════
// COMPLIANCE GRADING ENGINE
// Scores every note -- not just self-flagged or AI-safety-flagged
// ones -- against the UM/documentation framework standards. This is
// what closes the gap where a note with poor documentation but no
// safety concern would otherwise never surface to anyone. Grading runs
// three ways: the scheduled grade-notes job (pg_cron) does the bulk,
// AUTO_SCAN below catches up the signed-in reviewer's own scope, and
// org-wide reviewers can click "Grade oldest 25 now" for backfill.
// ══════════════════════════════════════════════════════════════════

// The grading rubric lives in the grade-notes Edge Function (edge/grade-notes/index.ts).

// Grading runs in the Supabase Edge Function `grade-notes` (it holds the
// Anthropic API key and also runs on a schedule via pg_cron -- see
// SETUP.md). The tracker just asks it to grade the next batch.
// Returns { ok, updates: [{id, ...fields}], counts, blank, remaining, error }.
async function gradeViaFunction(opts) {
  try {
    var res = await sb.functions.invoke('grade-notes', { body: opts });
    if (res.error) {
      var msg = res.error.message || 'Edge Function error';
      try { var ctx = res.error.context && await res.error.context.json(); if (ctx && ctx.error) msg = ctx.error; } catch (e) {}
      return { ok: false, updates: [], counts: {}, error: new Error(msg) };
    }
    var d = res.data || {};
    if (d.error) return { ok: false, updates: d.updates || [], counts: d.counts || {}, error: new Error(d.error) };
    return { ok: true, updates: d.updates || [], counts: d.counts || {}, blank: d.blank || 0, remaining: d.remaining, graded: d.graded || 0 };
  } catch (e) {
    return { ok: false, updates: [], counts: {}, error: e };
  }
}

// Manual backfill (org-wide only): oldest ungraded notes across the whole table.
var lastBackfillMsg = ''; // survives the page re-render after a backfill
async function gradeNextBatch() {
  if (!currentReviewer || currentReviewer.role !== 'org_wide') return;
  var btn = document.getElementById('gradeBatchBtn');
  var statusEl = document.getElementById('gradeBatchStatus');
  if (btn) { btn.disabled = true; btn.textContent = 'Grading…'; }
  if (statusEl) statusEl.textContent = 'Grading the oldest ungraded notes…';
  var out = await gradeViaFunction({ limit: 25, order: 'oldest' });
  if (statusEl) {
    var c = out.counts || {};
    statusEl.textContent = out.ok
      ? (out.graded ? ('Graded ' + out.graded + ' note(s): ' + (c['Compliant'] || 0) + ' compliant, ' + (c['Needs Improvement'] || 0) + ' needs improvement, ' + (c['Non-Compliant'] || 0) + ' non-compliant. ' + (out.remaining != null ? out.remaining + ' still ungraded.' : '')) : 'No ungraded notes remaining.')
      : ('Grading failed: ' + out.error.message);
  }
  if (statusEl) lastBackfillMsg = statusEl.textContent;
  if (btn) { btn.disabled = false; btn.textContent = 'Grade oldest 25 now'; }
  await loadAndRenderDashboard();
}

// ── AUTO-SCAN ──
// When a reviewer opens the tracker, ungraded notes in their scope are
// graded in the background, newest first, so new notes get scanned without
// anyone clicking a button. Capped per page visit to keep API cost bounded.
// (Long-term this belongs server-side -- see SETUP.md.)
var AUTO_SCAN = { enabled: true, batchSize: 15, maxPerVisit: 60 }; // the scheduled job does the bulk; this catches up the reviewer's own scope
var autoScanRunning = false;
var autoScanDone = 0;
var autoScanNewlyFlagged = 0;
var autoScanError = null;

async function autoScanInBackground() {
  if (!AUTO_SCAN.enabled || autoScanRunning || !currentReviewer) return;
  autoScanRunning = true;
  autoScanError = null;
  updateScanStatus();
  try {
    while (autoScanDone < AUTO_SCAN.maxPerVisit) {
      var scope = scopedProviderEmails(); // null = org-wide
      if (scope && !scope.length) break;
      var out = await gradeViaFunction({ limit: AUTO_SCAN.batchSize, order: 'newest', providerEmails: scope });
      if (out.ok && !out.updates.length) break; // nothing left to grade in scope
      autoScanDone += Math.max(out.updates.length, 1);
      out.updates.forEach(function(u) {
        var n = allNotes.find(function(x){ return x.id === u.id; });
        if (!n) return;
        var wasFlagged = noteHasAnyFlag(n);
        Object.assign(n, u);
        if (!wasFlagged && noteNeedsReview(n)) autoScanNewlyFlagged++;
      });
      var k = document.getElementById('kpiRow');
      if (k) k.innerHTML = kpiRowHtml();
      updateScanStatus();
      if (!out.ok) { autoScanError = out.error && out.error.message; break; }
    }
  } finally {
    autoScanRunning = false;
    updateScanStatus();
  }
}

function updateScanStatus() {
  var el = document.getElementById('scanStatus');
  if (!el) return;
  var inView = allNotes.length;
  var awaiting = allNotes.filter(function(n){ return !n.compliance_grade && !n.compliance_graded_at; }).length;
  var html = '';
  if (autoScanError) html = 'Grading paused: ' + escapeHtml(autoScanError);
  else if (awaiting) html = 'Grading in progress: ' + (inView - awaiting).toLocaleString() + ' of ' + inView.toLocaleString() + ' notes checked. New grades appear automatically every few minutes.';
  if (autoScanNewlyFlagged) html += (html ? ' ' : '') + '<a href="#" id="showNewlyFlagged">' + autoScanNewlyFlagged + ' newly flagged \u2014 update list</a>';
  el.innerHTML = html;
  el.style.display = html ? '' : 'none';
  var link = document.getElementById('showNewlyFlagged');
  if (link) link.onclick = function(e){ e.preventDefault(); refreshNotesView(); };
}

function emailProvider(note) {
  var msgEl = document.getElementById('emailMsg_' + note.id);
  var msg = msgEl ? msgEl.value.trim() : '';
  var subject = 'Follow-up needed: ' + (note.client_number || 'note') + ' (' + (note.program || '') + ')';
  var flagParts = [];
  if (note.concern_flagged) flagParts.push('a self-reported concern flag');
  if (note.itp_flagged) flagParts.push('an ITP flag');
  if (note.ai_concern_flagged && !note.concern_flagged) flagParts.push('a possible safety concern in the narrative');
  if (isDocQualityFlag(note)) flagParts.push('a documentation review grade of ' + note.compliance_grade);
  if (noteSimilarity[note.id] && noteSimilarity[note.id].length) flagParts.push('language that closely matches another of your notes');
  var flagLine = flagParts.length ? (', which has ' + flagParts.join(' and ')) : '';
  var dateStr = note.session_date ? new Date(note.session_date + 'T00:00:00').toLocaleDateString() : 'an unspecified date';
  var reasonLine = note._rejectReason ? ('This note was reviewed and needs revision. What to fix: ' + note._rejectReason + '\n\n') : '';

  var noteTextBlock = '';
  if (note.description_text || note.assessment_text || note.plan_text) {
    noteTextBlock = '--- NOTE TEXT (for reference) ---\n\n'
      + 'Description:\n' + (note.description_text || '(not saved)') + '\n\n'
      + 'Assessment:\n' + (note.assessment_text || '(not saved)') + '\n\n'
      + 'Plan:\n' + (note.plan_text || '(not saved)') + '\n\n'
      + '--- END NOTE TEXT ---\n\n';
  }

  var body = 'Hi,\n\n'
    + 'I was reviewing notes and wanted to follow up on the note for client ' + (note.client_number || '(no client number)')
    + ' in ' + (note.program || 'your program') + ', session date ' + dateStr + flagLine + '.\n\n'
    + reasonLine + (msg ? (msg + '\n\n') : '')
    + noteTextBlock
    + 'Could you take another look at this note in Pimsy when you get a chance?\n\n'
    + 'Thanks,\n' + (currentReviewer ? currentReviewer.name : '');
  var mailto = 'mailto:' + encodeURIComponent(note.provider_email)
    + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  window.location.href = mailto;
}

// Short, plain-language reasons this note is flagged -- the one line a
// manager reads to decide whether to open it.
function flagSummary(note) {
  var out = [];
  var sim = noteSimilarity[note.id] || [];
  if (note.ai_concern_flagged && !note.concern_flagged) out.push({ t: '⚠ Possible risk, not reported by coach', c: 'risk' });
  if (note.concern_flagged) out.push({ t: 'Concern reported by coach', c: 'risk' });
  if (isUnknownAuthor(note)) out.push({ t: 'Unknown author', c: 'risk' });
  if (sim.some(function(x){ return x.crossClient; })) out.push({ t: 'Matches another client’s note', c: 'risk' });
  if (sim.some(function(x){ return !x.crossClient; })) out.push({ t: 'Repeats an earlier note', c: 'warn' });
  if (isDocQualityFlag(note)) {
    var themes = {};
    (note.compliance_issues || []).forEach(function(i){ var m = String(i).match(/^\s*\[([^\]]+)\]/); if (m) themes[m[1]] = true; });
    var t = Object.keys(themes);
    out.push({ t: note.compliance_grade + (t.length ? (': ' + t.join(', ')) : ''), c: note.compliance_grade === 'Non-Compliant' ? 'risk' : 'warn' });
  }
  if (note.itp_flagged) out.push({ t: 'ITP update requested', c: 'info' });
  return out;
}

function stripIssueTag(s) { return String(s).replace(/^\s*\[[^\]]+\]\s*/, ''); }
function issueTag(s) { var m = String(s).match(/^\s*\[([^\]]+)\]/); return m ? m[1] : ''; }

function renderNoteCard(note) {
  var hasAnyFlag = noteHasAnyFlag(note);
  var tone = note.reviewed ? ' reviewed' : (hasAnyFlag ? ((note.concern_flagged || note.ai_concern_flagged || isUnknownAuthor(note)) ? ' concern' : ' itp') : '');
  var fmtD = function(d){ return d ? new Date(d).toLocaleDateString() : ''; };
  var dateStr = note.session_date ? new Date(note.session_date + 'T00:00:00').toLocaleDateString() : '—';
  var simMatches = noteSimilarity[note.id] || [];

  // ── Status chips (right side): only where the note IS, not why it's flagged.
  var status = [];
  if (note.reviewed && note.review_outcome === 'approved') status.push('<span class="badge badge-reviewed">Approved</span>');
  if (note.reviewed && note.review_outcome === 'rejected') status.push('<span class="badge badge-rejected">Sent back</span>');
  if (note.director_escalated) status.push('<span class="badge badge-director-escalated">Director' + (note.director_escalated_ack ? ' ✓' : '') + '</span>');
  if (note.escalated) status.push('<span class="badge badge-escalated">Clinical Dir.' + (note.resolved ? ' ✓' : '') + '</span>');
  if (note.ur_referred) status.push('<span class="badge badge-escalated">UR' + (note.ur_resolved ? ' ✓' : '') + '</span>');
  if (isAwaitingScan(note)) status.push('<span class="badge badge-other">Awaiting scan</span>');

  // ── One-line "why flagged".
  var reasons = flagSummary(note);
  var whyHtml = reasons.length
    ? '<div class="nc-why">' + reasons.map(function(r){ return '<span class="why-chip why-' + r.c + '">' + escapeHtml(r.t) + '</span>'; }).join('') + '</div>'
    : '<div class="nc-why"><span class="why-chip why-ok">' + (isAwaitingScan(note) ? 'Not scanned yet' : 'Routine — no flags') + '</span></div>';

  // ── Details panel contents (hidden until "Review").
  var prompts = note.reviewed ? [] : reviewPrompts(note);
  var promptsHtml = prompts.length
    ? '<div class="nc-section"><div class="nc-label">What to look at</div><ul class="nc-list">' + prompts.map(function(p){ return '<li class="rp-' + p.level + '">' + escapeHtml(p.text) + '</li>'; }).join('') + '</ul></div>'
    : '';
  var issuesHtml = (note.compliance_issues && note.compliance_issues.length)
    ? '<div class="nc-section"><div class="nc-label">Documentation issues' + (note.compliance_score != null ? ' <span class="nc-score">score ' + escapeHtml(String(note.compliance_score)) + '/100</span>' : '') + '</div><ul class="nc-list">'
      + note.compliance_issues.map(function(i){ var tag = issueTag(i); return '<li>' + (tag ? '<b>' + escapeHtml(tag) + ':</b> ' : '') + escapeHtml(stripIssueTag(i)) + '</li>'; }).join('') + '</ul></div>'
    : '';
  var concernHtml = (note.concern_type && note.concern_type.length)
    ? '<div class="nc-section"><div class="nc-label">Concern type</div><div class="nc-plain">' + note.concern_type.map(escapeHtml).join(', ') + '</div></div>' : '';
  var simHtml = simMatches.length
    ? '<div class="nc-section"><div class="nc-label">Similar notes</div><ul class="nc-list">' + simMatches.slice().sort(function(a, b){ return b.sim - a.sim; }).slice(0, 3).map(function(x){
        return '<li>' + Math.round(x.sim * 100) + '% match with ' + (x.crossClient ? ('client ' + escapeHtml(x.client || '?') + '’s note') : 'this client’s note') + ' from ' + (x.date ? new Date(x.date + 'T00:00:00').toLocaleDateString() : '?') + '</li>';
      }).join('') + '</ul></div>' : '';

  // Escalation / review history, shown in the details panel.
  var history = [];
  if (note.reviewed) history.push((note.review_outcome === 'rejected' ? 'Sent back to coach' : 'Approved') + ' by ' + escapeHtml(note.reviewed_by || '—') + (note.reviewed_date ? ' on ' + fmtD(note.reviewed_date) : '') + ((note.review_outcome === 'rejected' && note.reject_reason) ? ' — “' + escapeHtml(note.reject_reason) + '”' : ''));
  if (note.director_escalated) history.push('Escalated to Director' + (note.director_escalated_to ? ' (' + escapeHtml(note.director_escalated_to) + ')' : '') + ' by ' + escapeHtml(note.director_escalated_by || '—') + (note.director_escalated_date ? ' on ' + fmtD(note.director_escalated_date) : '') + (note.director_escalated_ack ? ' — acknowledged by ' + escapeHtml(note.director_escalated_ack_by || '—') : ''));
  if (note.escalated) history.push('Escalated to Clinical Director by ' + escapeHtml(note.escalated_by || '—') + (note.escalated_date ? ' on ' + fmtD(note.escalated_date) : '') + (note.resolved ? ' — resolved by ' + escapeHtml(note.resolved_by || '—') + (note.resolution_notes ? ': ' + escapeHtml(note.resolution_notes) : '') : ' — awaiting Clinical Director Hub'));
  if (note.ur_referred) history.push('Referred to Utilization Review by ' + escapeHtml(note.ur_referred_by || '—') + (note.ur_referred_date ? ' on ' + fmtD(note.ur_referred_date) : '') + (note.ur_reason ? ' — “' + escapeHtml(note.ur_reason) + '”' : '') + (note.ur_resolved ? ' — complete' + (note.ur_outcome ? ': ' + escapeHtml(note.ur_outcome) : '') : ''));
  var historyHtml = history.length ? '<div class="nc-section"><div class="nc-label">History</div><ul class="nc-list">' + history.map(function(h){ return '<li>' + h + '</li>'; }).join('') + '</ul></div>' : '';

  var hasNoteText = note.description_text || note.assessment_text || note.plan_text;
  var missing = [];
  if (hasNoteText) { if (!note.description_text) missing.push('Description'); if (!note.assessment_text) missing.push('Assessment'); if (!note.plan_text) missing.push('Plan'); }
  var noteTextHtml = hasNoteText
    ? '<div class="nc-section"><div class="nc-label">Note</div>'
      + (missing.length ? '<p class="partial-note-text">' + missing.join(' and ') + ' did not save — check the source note in Pimsy.</p>' : '')
      + '<div class="nc-note"><div class="nc-note-h">Description</div><p>' + escapeHtml(note.description_text || '—') + '</p>'
      + '<div class="nc-note-h">Assessment</div><p>' + escapeHtml(note.assessment_text || '—') + '</p>'
      + '<div class="nc-note-h">Plan</div><p>' + escapeHtml(note.plan_text || '—') + '</p></div></div>'
    : '<div class="nc-section"><p class="no-note-text">No note text was saved for this entry — review the source note in Pimsy.</p></div>';
  var emailHtml = note.provider_email
    ? '<div class="nc-section"><div class="nc-label">Message the coach (optional)</div><textarea class="nc-textarea" id="emailMsg_' + note.id + '" placeholder="e.g. Can you take another look at the Plan section?"></textarea>'
      + '<button class="nc-btn ghost" id="emailBtn_' + note.id + '">Email ' + escapeHtml(coachName(note.provider_email)) + '</button></div>'
    : '';

  // ── Action bar: two primary actions, escalations tucked in a menu.
  var acts = '';
  if (!note.reviewed) {
    var escItems = ''
      + (note.director_escalated ? '' : '<button class="nc-menu-item" id="escalateDirectorBtn_' + note.id + '">To Director</button>')
      + (note.escalated ? '' : '<button class="nc-menu-item" id="escalateClinicalBtn_' + note.id + '">To Clinical Director</button>')
      + (note.ur_referred ? '' : '<button class="nc-menu-item" id="urBtn_' + note.id + '">To Utilization Review</button>');
    acts += '<button class="nc-btn approve" id="approveBtn_' + note.id + '">Approve</button>'
      + '<button class="nc-btn send" id="rejectBtn_' + note.id + '">Send back to coach</button>'
      + (escItems ? '<details class="nc-menu"><summary class="nc-btn ghost">Escalate ▾</summary><div class="nc-menu-pop">' + escItems + '</div></details>' : '');
  }
  if (note.director_escalated && !note.director_escalated_ack) acts += '<button class="nc-btn ghost" id="ackDirectorBtn_' + note.id + '">Acknowledge escalation</button>';
  if (note.ur_referred && !note.ur_resolved) acts += '<button class="nc-btn ghost" id="urDoneBtn_' + note.id + '">Mark UR complete</button>';
  acts += '<button class="nc-btn link collapse-toggle-lite" id="collapseToggle_' + note.id + '">Review note ▾</button>';

  return `
    <div class="note-card nc${tone}">
      <div class="nc-head">
        ${(!note.reviewed && currentMode === 'flagged') ? '<input type="checkbox" class="nc-check" data-id="' + escapeHtml(String(note.id)) + '"' + (selectedIds[note.id] ? ' checked' : '') + ' title="Select for bulk approve"/>' : ''}
        <div class="nc-main">
          <div class="nc-title"><span class="client">${escapeHtml(note.client_number || 'No client #')}</span><span class="nc-dot">·</span>${escapeHtml(note.program || '—')}<span class="nc-dot">·</span>${dateStr}</div>
          <div class="nc-sub"><span title="${escapeHtml(note.provider_email || '')}">${escapeHtml(coachName(note.provider_email))}</span>${note.provider_email ? ' · ' + escapeHtml(managerFor(note.provider_email)) : ''}</div>
        </div>
        <div class="nc-status">${status.join('')}</div>
      </div>
      ${whyHtml}
      <div class="nc-actions">${acts}</div>
      <div class="note-content nc-details" id="noteContent_${note.id}" style="display:none;">
        ${promptsHtml}${issuesHtml}${concernHtml}${simHtml}${historyHtml}${noteTextHtml}${emailHtml}
      </div>
    </div>
  `;
}

// ── CASELOAD PATTERNS ──
// Client-level oversight, distinct from the note-level review above. These
// look ACROSS a client's note history (not any single note) to surface
// patterns a manager would otherwise only catch by reading every file or
// waiting for a PRS to raise it. All thresholds below are a starting point,
// not a clinical standard -- adjust the numbers if they don't match reality.

var STAGE_RANK = { 'Pre-contemplation': 0, 'Contemplation': 1, 'Preparation': 2, 'Action': 3, 'Maintenance': 4 };
function stageRank(stageText) {
  if (!stageText) return null;
  var key = Object.keys(STAGE_RANK).find(function(k){ return stageText.indexOf(k) === 0; });
  return (key !== undefined) ? STAGE_RANK[key] : null;
}

function groupNotesByClient(notes) {
  var byClient = {};
  notes.forEach(function(n) {
    if (!n.client_number) return; // can't run client-level analysis without an ID to group on
    if (!byClient[n.client_number]) byClient[n.client_number] = [];
    byClient[n.client_number].push(n);
  });
  Object.keys(byClient).forEach(function(cn) {
    byClient[cn].sort(function(a, b){ return new Date(a.session_date || 0) - new Date(b.session_date || 0); });
  });
  return byClient;
}

// Last 3 standard-note sessions all at Maintenance, no setback, no safety concerns.
function detectGraduationTrend(clientNotes) {
  var std = clientNotes.filter(function(n){ return n.note_type === 'standard' && n.stage_of_change; });
  if (std.length < 3) return null;
  var last3 = std.slice(-3);
  var allMaintenance = last3.every(function(n){ return (n.stage_of_change || '').indexOf('Maintenance') === 0; });
  var noSetback = last3.every(function(n){
    var s = (n.goal_progress_status || '').toLowerCase();
    return s.indexOf('setback') === -1 && s.indexOf('difficulty') === -1;
  });
  var noConcerns = last3.every(function(n){ return !n.concern_flagged && !n.ai_concern_flagged; });
  if (!(allMaintenance && noSetback && noConcerns)) return null;
  return {
    noteIds: last3.map(function(n){ return n.id; }),
    evidence: last3.map(function(n){ return (n.session_date || '?') + ' \u2014 Maintenance, ' + (n.goal_progress_status || 'no status'); })
  };
}

// Stage regressed across the last 3 sessions, OR 2+ setbacks, OR 2+ sessions
// with a notably negative presentation.
var NEGATIVE_PRESENTATION = ['Withdrawn', 'Guarded', 'Frustrated', 'Distracted', 'Anxious', 'Tearful'];
function detectDisengagementTrend(clientNotes) {
  var std = clientNotes.filter(function(n){ return n.note_type === 'standard'; });
  if (std.length < 3) return null;
  var last3 = std.slice(-3);
  var reasons = [];

  var firstRank = stageRank(last3[0].stage_of_change);
  var lastRank = stageRank(last3[2].stage_of_change);
  if (firstRank !== null && lastRank !== null && lastRank < firstRank) {
    reasons.push('Stage of Change moved backward: ' + last3[0].stage_of_change + ' \u2192 ' + last3[2].stage_of_change);
  }

  var setbackCount = last3.filter(function(n){
    var s = (n.goal_progress_status || '').toLowerCase();
    return s.indexOf('setback') > -1 || s.indexOf('difficulty') > -1;
  }).length;
  if (setbackCount >= 2) reasons.push(setbackCount + ' of the last 3 sessions noted a setback or difficulty toward the goal');

  var negativeCount = last3.filter(function(n){
    var chips = n.presentation || [];
    return chips.some(function(c){ return NEGATIVE_PRESENTATION.indexOf(c) > -1; });
  }).length;
  if (negativeCount >= 2) reasons.push(negativeCount + ' of the last 3 sessions noted a presentation like Withdrawn, Guarded, Frustrated, or Anxious');

  if (reasons.length === 0) return null;
  return { noteIds: last3.map(function(n){ return n.id; }), evidence: reasons };
}

// 2+ notes flagged (self-reported or AI-caught) for this client, none escalated.
function detectRepeatSafetyWithoutEscalation(clientNotes) {
  var flagged = clientNotes.filter(function(n){ return n.concern_flagged || n.ai_concern_flagged; });
  if (flagged.length < 2) return null;
  if (flagged.some(function(n){ return n.escalated; })) return null;
  return {
    noteIds: flagged.map(function(n){ return n.id; }),
    evidence: flagged.map(function(n){ return (n.session_date || '?') + ': ' + (n.concern_flagged ? 'self-reported concern' : 'AI-detected risk, not self-reported'); })
  };
}

// 2+ of the last 3 standard notes flagged a need for an ITP update.
function detectRepeatItpWithoutResolution(clientNotes) {
  var std = clientNotes.filter(function(n){ return n.note_type === 'standard'; });
  if (std.length < 2) return null;
  var last3 = std.slice(-3);
  var itpNotes = last3.filter(function(n){ return n.itp_flagged; });
  if (itpNotes.length < 2) return null;
  return {
    noteIds: itpNotes.map(function(n){ return n.id; }),
    evidence: itpNotes.map(function(n){ return (n.session_date || '?') + ': ITP update flagged'; })
  };
}

// FIX (BUG-14, 9/4): SLI support-level direction should agree with actual service-hours
// direction -- a client whose level improved but whose hours haven't come down (or one whose
// level worsened but whose hours haven't gone up) is worth a manager's eye. This needs FULL
// SLI assessment history per client (not just the current row), which loadCaseloadPatterns
// fetches separately and passes in as `sliHistory` -- the second argument every other detector
// above ignores. Hours are compared using the same two-window approach as the Utilization tab
// (recent UTILIZATION_WEEKS_BACK weeks vs. the UTILIZATION_WEEKS_BACK weeks before that); a
// >15% change either direction counts as "moved," anything smaller is "flat" so ordinary
// week-to-week noise doesn't trigger a false pattern.
function sliLevelDirection(sliHistory) {
  if (!sliHistory || sliHistory.length < 2) return null;
  var sorted = sliHistory.slice().sort(function(a, b){ return new Date(a.assessment_date || 0) - new Date(b.assessment_date || 0); });
  var prev = sorted[sorted.length - 2];
  var curr = sorted[sorted.length - 1];
  if (prev.final_support_level == null || curr.final_support_level == null) return null;
  if (curr.final_support_level === prev.final_support_level) return null;
  return {
    direction: curr.final_support_level < prev.final_support_level ? 'improving' : 'declining',
    prev: prev,
    curr: curr
  };
}

function computeTwoWindowHours(clientNotes) {
  var msPerWeek = 1000 * 60 * 60 * 24 * 7;
  var now = Date.now();
  var recentStart = now - UTILIZATION_WEEKS_BACK * msPerWeek;
  var priorStart = now - (UTILIZATION_WEEKS_BACK * 2) * msPerWeek;
  var recent = 0, prior = 0;
  clientNotes.forEach(function(n) {
    if (n.note_type !== 'standard' || !n.session_date) return;
    var hrs = sessionLengthToHours(n.session_length);
    if (hrs === null) return;
    var t = new Date(n.session_date + 'T00:00:00').getTime();
    if (t >= recentStart) recent += hrs;
    else if (t >= priorStart) prior += hrs;
  });
  return { recent: recent, prior: prior };
}

function classifyHoursChange(hoursRecent, hoursPrior) {
  if (hoursPrior === 0) return hoursRecent === 0 ? 'flat' : 'increased';
  var pct = (hoursRecent - hoursPrior) / hoursPrior;
  if (pct > 0.15) return 'increased';
  if (pct < -0.15) return 'decreased';
  return 'flat';
}

function recentStandardNoteIds(clientNotes) {
  var std = clientNotes.filter(function(n){ return n.note_type === 'standard'; });
  var cutoff = Date.now() - UTILIZATION_WEEKS_BACK * 7 * 24 * 60 * 60 * 1000;
  var recentIds = std.filter(function(n){
    return n.session_date && new Date(n.session_date + 'T00:00:00').getTime() >= cutoff;
  }).map(function(n){ return n.id; });
  return recentIds.length ? recentIds : std.slice(-1).map(function(n){ return n.id; });
}

// Improving support level (lower SLI number = less support needed), but service volume
// hasn't stepped down to match.
function detectUtilStepDown(clientNotes, sliHistory) {
  var dir = sliLevelDirection(sliHistory);
  if (!dir || dir.direction !== 'improving') return null;
  var hrs = computeTwoWindowHours(clientNotes);
  var hoursDir = classifyHoursChange(hrs.recent, hrs.prior);
  if (hoursDir === 'decreased') return null; // already stepped down -- nothing to flag
  return {
    noteIds: recentStandardNoteIds(clientNotes),
    evidence: [
      'SLI support level improved: Level ' + dir.prev.final_support_level + ' (' + (dir.prev.assessment_date || '?') + ') → Level ' + dir.curr.final_support_level + ' (' + (dir.curr.assessment_date || '?') + ')',
      'Service hours, last ' + UTILIZATION_WEEKS_BACK + ' wks vs. prior ' + UTILIZATION_WEEKS_BACK + ' wks: ' + hrs.recent.toFixed(1) + ' vs. ' + hrs.prior.toFixed(1) + ' hrs (' + hoursDir + ') — hasn’t stepped down with the improved level'
    ]
  };
}

// Declining support level (higher SLI number = more support needed), but service volume
// hasn't stepped up to match.
function detectUtilStepUp(clientNotes, sliHistory) {
  var dir = sliLevelDirection(sliHistory);
  if (!dir || dir.direction !== 'declining') return null;
  var hrs = computeTwoWindowHours(clientNotes);
  var hoursDir = classifyHoursChange(hrs.recent, hrs.prior);
  if (hoursDir === 'increased') return null; // already stepped up -- nothing to flag
  return {
    noteIds: recentStandardNoteIds(clientNotes),
    evidence: [
      'SLI support level declined: Level ' + dir.prev.final_support_level + ' (' + (dir.prev.assessment_date || '?') + ') → Level ' + dir.curr.final_support_level + ' (' + (dir.curr.assessment_date || '?') + ')',
      'Service hours, last ' + UTILIZATION_WEEKS_BACK + ' wks vs. prior ' + UTILIZATION_WEEKS_BACK + ' wks: ' + hrs.recent.toFixed(1) + ' vs. ' + hrs.prior.toFixed(1) + ' hrs (' + hoursDir + ') — hasn’t stepped up with the declining level'
    ]
  };
}

var PATTERN_DETECTORS = [
  { type: 'graduation', label: 'Graduation Trending', fn: detectGraduationTrend },
  { type: 'disengagement', label: 'Disengagement Trending', fn: detectDisengagementTrend },
  { type: 'repeat_safety', label: 'Repeat Safety Flag, Not Escalated', fn: detectRepeatSafetyWithoutEscalation },
  { type: 'repeat_itp', label: 'Repeat ITP Flag, Not Resolved', fn: detectRepeatItpWithoutResolution },
  { type: 'util_step_down', label: 'Improving, Service Volume Hasn’t Stepped Down', fn: detectUtilStepDown },
  { type: 'util_step_up', label: 'Declining, Service Volume Hasn’t Stepped Up', fn: detectUtilStepUp }
];

async function loadCaseloadPatterns() {
  var container = document.getElementById('patternsMode');
  container.innerHTML = '<div class="loading-state">Loading caseload patterns&hellip;</div>';

  function buildPatternsQuery() {
    return scopeNotesQuery(sb.from(TABLE).select('*')
      .order('session_date', { ascending: true })
      .order('id', { ascending: true }));
  }
  if (!buildPatternsQuery()) {
    renderCaseloadPatterns([], 0);
    return;
  }
  var { data: notes, error: notesErr } = await fetchAllRows(function(from, to) {
    return buildPatternsQuery().range(from, to);
  });
  if (notesErr) {
    container.innerHTML = '<div class="empty-state"><p>Error loading notes: ' + escapeHtml(notesErr.message) + '</p></div>';
    return;
  }
  notes = notes || [];

  var { data: acks, error: acksErr } = await sb.from('client_pattern_acks').select('*');
  if (acksErr) {
    console.warn('[Caseload Patterns] Could not load acknowledgments (patterns will still show, just without ack state): ' + acksErr.message);
  }
  acks = acks || [];

  var withoutClientNumber = notes.filter(function(n){ return !n.client_number; }).length;
  var byClient = groupNotesByClient(notes);

  // FIX (BUG-14, 9/4): the util_step_down/util_step_up detectors need each client's FULL SLI
  // assessment history (to compare the last two levels), not just the current one -- fetch it
  // separately and scope it to clients already present in this reviewer's (already-scoped)
  // notes, the same trick loadLeadershipDashboard uses since sli_assessments has no
  // provider/roster link of its own.
  var sliHistoryByClient = {};
  var sliHistRes = await sb.from(SLI_TABLE).select('client_number, final_support_level, assessment_date').order('assessment_date', { ascending: true });
  if (!sliHistRes.error) {
    (sliHistRes.data || []).forEach(function(r) {
      if (!r.client_number || !byClient[r.client_number]) return;
      if (!sliHistoryByClient[r.client_number]) sliHistoryByClient[r.client_number] = [];
      sliHistoryByClient[r.client_number].push(r);
    });
  }

  var results = [];
  Object.keys(byClient).forEach(function(cn) {
    var clientNotes = byClient[cn];
    var program = clientNotes[clientNotes.length - 1].program;
    PATTERN_DETECTORS.forEach(function(d) {
      var res = d.fn(clientNotes, sliHistoryByClient[cn] || []);
      if (!res) return;
      var sortedIds = res.noteIds.slice().sort().join(',');
      var isAcked = acks.some(function(a){
        return a.client_number === cn && a.pattern_type === d.type &&
          (a.contributing_note_ids || []).slice().sort().join(',') === sortedIds;
      });
      if (isAcked) return;
      results.push({ client_number: cn, program: program, pattern_type: d.type, label: d.label, evidence: res.evidence, noteIds: res.noteIds });
    });
  });

  renderCaseloadPatterns(results, withoutClientNumber);
}

function renderCaseloadPatterns(results, withoutClientNumber) {
  var container = document.getElementById('patternsMode');
  var countNote = withoutClientNumber > 0
    ? ('<div class="pattern-count-note">' + withoutClientNumber + ' note(s) had no client number on file and could not be included in this analysis.</div>')
    : '';

  if (results.length === 0) {
    container.innerHTML = `
      <div class="pattern-intro">
        <strong>Caseload Patterns</strong> looks across each client's full note history (not just flagged notes) to surface trends a manager would otherwise only catch by reading every file. Thresholds are a starting point &mdash; tell me if they don't match clinical reality and I'll adjust them.
      </div>
      ${countNote}
      <div class="empty-state"><p>No patterns detected in your scope right now.</p></div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="pattern-intro">
      <strong>Caseload Patterns</strong> looks across each client's full note history (not just flagged notes) to surface trends a manager would otherwise only catch by reading every file. Thresholds are a starting point &mdash; tell me if they don't match clinical reality and I'll adjust them.
    </div>
    ${countNote}
    ${results.map(renderPatternCard).join('')}
  `;

  results.forEach(function(r){
    var btn = document.getElementById('ackBtn_' + r.pattern_type + '_' + r.client_number);
    if (btn) btn.onclick = function(){ acknowledgePattern(r, btn); };
  });
}

function renderPatternCard(r) {
  var evidenceHtml = '<ul>' + r.evidence.map(function(e){ return '<li>' + escapeHtml(e) + '</li>'; }).join('') + '</ul>';
  var safeId = 'ackBtn_' + r.pattern_type + '_' + r.client_number;
  return `
    <div class="pattern-card ${r.pattern_type}">
      <div class="pattern-top">
        <div class="pattern-meta">
          <span class="client">${escapeHtml(r.client_number)}</span> <span class="divider">&middot;</span> ${escapeHtml(r.program || '—')}
          <div><span class="pattern-label ${r.pattern_type}">${escapeHtml(r.label)}</span></div>
          <div class="pattern-evidence">${evidenceHtml}</div>
        </div>
        <button class="ack-btn" id="${safeId}">Acknowledge</button>
      </div>
    </div>
  `;
}

async function acknowledgePattern(r, btn) {
  btn.disabled = true;
  btn.textContent = 'Saving…';
  var { error } = await sb.from('client_pattern_acks').insert({
    client_number: r.client_number,
    pattern_type: r.pattern_type,
    contributing_note_ids: r.noteIds,
    acknowledged_by: currentReviewer.name
  });
  if (error) {
    alert('Could not acknowledge: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'Acknowledge';
    return;
  }
  await loadCaseloadPatterns();
}

// LEADERSHIP DASHBOARD
// Rolls up documentation compliance, safety-flag trends, and
// escalation resolution time across the whole org (or the reviewer's
// scope). Unlike Note Review, this pulls ALL notes -- not just
// flagged ones -- because rates need a denominator: "12 flags out of
// 400 notes" means something different from "12 flags out of 40."
// ══════════════════════════════════════════════════════════════════

var LEADERSHIP_MONTHS_BACK = 9;
var UTILIZATION_WEEKS_BACK = 8;
var SLI_TABLE = 'sli_assessments';

async function loadLeadershipDashboard() {
  var container = document.getElementById('leadershipMode');
  container.innerHTML = '<div class="loading-state">Loading leadership dashboard&hellip;</div>';

  var since = new Date();
  since.setMonth(since.getMonth() - LEADERSHIP_MONTHS_BACK);
  var sinceStr = since.toISOString().slice(0, 10);

  var utilSince = new Date();
  utilSince.setDate(utilSince.getDate() - (UTILIZATION_WEEKS_BACK * 7));
  var utilSinceStr = utilSince.toISOString().slice(0, 10);

  function buildLeadershipNotesQuery() {
    return scopeNotesQuery(sb
      .from(TABLE)
      .select('id, client_number, session_date, provider_email, program, note_type, session_length, concern_flagged, itp_flagged, ai_concern_flagged, escalated, escalated_date, resolved, resolved_date, compliance_grade, compliance_issues')
      .gte('session_date', sinceStr)
      .order('session_date', { ascending: true })
      .order('id', { ascending: true }));
  }

  var coachSince = new Date();
  coachSince.setDate(coachSince.getDate() - COACHING.windowDays);
  var coachSinceStr = coachSince.toISOString().slice(0, 10);

  if (!buildLeadershipNotesQuery()) {
    renderLeadershipDashboard([], [], utilSinceStr, {}, {}, coachSinceStr);
    return;
  }

  var notesRes = await fetchAllRows(function(from, to) {
    return buildLeadershipNotesQuery().range(from, to);
  });

  if (notesRes.error) {
    container.innerHTML = '<div class="empty-state"><p>Error loading leadership data: ' + escapeHtml(notesRes.error.message) + '</p></div>';
    return;
  }

  // SLI table may not exist yet in every environment -- degrade gracefully
  // rather than blocking the whole dashboard if the utilization piece isn't set up.
  var sliRows = [];
  var sliRes = await sb.from(SLI_TABLE).select('client_number, final_support_level, assessment_date, is_current').eq('is_current', true);
  if (!sliRes.error) sliRows = sliRes.data || [];

  // FIX (BUG-14, 9/4): the "SLI Trend" column needs each client's full assessment history
  // (last two levels), not just the current one -- a separate query from the is_current-only
  // one above, which the rest of the Utilization tab still relies on.
  var sliHistoryRows = [];
  var sliHistRes = await sb.from(SLI_TABLE).select('client_number, final_support_level, assessment_date').order('assessment_date', { ascending: true });
  if (!sliHistRes.error) sliHistoryRows = sliHistRes.data || [];

  // Scope SLI rows to clients that actually appear in this reviewer's notes,
  // so a division director's Utilization tab doesn't leak other divisions'
  // client-level SLI data (the SLI table itself has no provider/roster link).
  var scopeEmails = scopedProviderEmails();
  if (scopeEmails !== null) {
    var scopedClients = {};
    (notesRes.data || []).forEach(function(n){ if (n.client_number) scopedClients[n.client_number] = true; });
    sliRows = sliRows.filter(function(r){ return scopedClients[r.client_number]; });
    sliHistoryRows = sliHistoryRows.filter(function(r){ return scopedClients[r.client_number]; });
  }

  var sliHistoryByClient = {};
  sliHistoryRows.forEach(function(r) {
    if (!r.client_number) return;
    if (!sliHistoryByClient[r.client_number]) sliHistoryByClient[r.client_number] = [];
    sliHistoryByClient[r.client_number].push(r);
  });

  // Provider Scorecard needs note text for the repetitive-language check, but
  // only for its own 90-day window -- pulling 9 months of narrative text just
  // for this would be wasteful. Degrades to "no similarity data" on error.
  var simMap = {};
  var textRes = await fetchAllRows(function(from, to) {
    return scopeNotesQuery(sb.from(TABLE)
      .select('id, provider_email, client_number, session_date, note_type, description_text, assessment_text, plan_text')
      .gte('session_date', coachSinceStr)
      .order('session_date', { ascending: true })
      .order('id', { ascending: true })).range(from, to);
  });
  if (textRes.error) console.warn('Could not load note text for repetitive-language check', textRes.error);
  else simMap = computeNoteSimilarity(textRes.data || []);

  renderLeadershipDashboard(notesRes.data || [], sliRows, utilSinceStr, sliHistoryByClient, simMap, coachSinceStr);
}

function monthKey(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr + 'T00:00:00');
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function monthLabel(key) {
  var parts = key.split('-');
  var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
  return d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
}

function computeMonthlyTrend(notes) {
  var byMonth = {};
  notes.forEach(function(n) {
    var k = monthKey(n.session_date);
    if (!k) return;
    if (!byMonth[k]) byMonth[k] = { total: 0, concern: 0, aiOnly: 0, itp: 0 };
    byMonth[k].total++;
    if (n.concern_flagged) byMonth[k].concern++;
    if (n.ai_concern_flagged && !n.concern_flagged) byMonth[k].aiOnly++;
    if (n.itp_flagged) byMonth[k].itp++;
  });
  return Object.keys(byMonth).sort().map(function(k) {
    return Object.assign({ key: k }, byMonth[k]);
  });
}

// Provider Coaching Scorecard. "Flagged" = the note has at least one
// coaching flag (see noteCoachingFlags): documentation grade, repetitive
// language, possible copy-paste, or an AI-caught safety concern the PRS
// didn't self-report. Self-reported concerns and ITP flags are counted
// separately and never count against a provider.
function computeProviderScorecard(notes, simMap) {
  var byProvider = {};
  notes.forEach(function(n) {
    var key = n.provider_email || '(no provider email on file)';
    if (!byProvider[key]) byProvider[key] = { total: 0, flagged: 0, aiOnly: 0, selfConcern: 0, itp: 0, graded: 0, docFlag: 0, repetitive: 0, crossClient: 0, escalated: 0, unresolvedEsc: 0, themes: {} };
    var p = byProvider[key];
    var flags = noteCoachingFlags(n, simMap);
    p.total++;
    if (flags.length) p.flagged++;
    if (n.compliance_grade) p.graded++;
    if (flags.indexOf('doc_quality') >= 0) {
      p.docFlag++;
      var issues = n.compliance_issues || [];
      if (!issues.length) p.themes.other = (p.themes.other || 0) + 1;
      // Count each theme once per note so one long issue list doesn't dominate.
      var seen = {};
      issues.forEach(function(i){ seen[issueTheme(i)] = true; });
      Object.keys(seen).forEach(function(t){ p.themes[t] = (p.themes[t] || 0) + 1; });
    }
    ['repetitive', 'cross_client', 'ai_only'].forEach(function(t){ if (flags.indexOf(t) >= 0) p.themes[t] = (p.themes[t] || 0) + 1; });
    if (flags.indexOf('repetitive') >= 0) p.repetitive++;
    if (flags.indexOf('cross_client') >= 0) p.crossClient++;
    if (flags.indexOf('ai_only') >= 0) p.aiOnly++;
    if (n.concern_flagged) p.selfConcern++;
    if (n.itp_flagged) p.itp++;
    if (n.escalated) p.escalated++;
    if (n.escalated && !n.resolved) p.unresolvedEsc++;
  });
  return Object.keys(byProvider).map(function(k) {
    var p = byProvider[k];
    var reasons = [];
    if (p.total >= COACHING.minNotes) {
      if (p.graded >= COACHING.minGraded && (p.docFlag / p.graded) >= COACHING.docRate)
        reasons.push(p.docFlag + ' of ' + p.graded + ' graded notes need improvement');
      if ((p.repetitive / p.total) >= COACHING.repeatRate)
        reasons.push(p.repetitive + ' of ' + p.total + ' notes repeat earlier language for the same client');
      if (p.aiOnly >= COACHING.aiOnlyMin)
        reasons.push(p.aiOnly + ' safety concerns not self-reported');
    }
    // Copy-paste across clients is worth a look even on a small caseload.
    if (p.crossClient >= COACHING.crossClientMin)
      reasons.push(p.crossClient + ' note' + (p.crossClient === 1 ? '' : 's') + ' closely match another client’s note');
    return Object.assign({ provider: k, manager: managerFor(k === '(no provider email on file)' ? null : k), flagRate: p.total ? (p.flagged / p.total) : 0, reasons: reasons, focus: topThemes(p.themes, 2) }, p);
  }).sort(function(a, b) { return (b.reasons.length - a.reasons.length) || (b.flagRate - a.flagRate); });
}

// Team-level view: is a theme showing up across several of one manager's
// providers? That points at team training/manager support rather than one PRS.
function computeManagerRollup(scorecard) {
  var byMgr = {};
  scorecard.forEach(function(p) {
    var m = byMgr[p.manager] = byMgr[p.manager] || { manager: p.manager, providers: 0, total: 0, flagged: 0, needsSupport: 0, themeProviders: {} };
    m.providers++;
    m.total += p.total;
    m.flagged += p.flagged;
    if (p.reasons.length) m.needsSupport++;
    Object.keys(p.themes).forEach(function(t) {
      if (t !== 'other' && p.themes[t] >= 2) m.themeProviders[t] = (m.themeProviders[t] || 0) + 1;
    });
  });
  return Object.keys(byMgr).map(function(k) {
    var m = byMgr[k];
    m.flagRate = m.total ? m.flagged / m.total : 0;
    m.teamPatterns = Object.keys(m.themeProviders).filter(function(t) {
      return m.themeProviders[t] >= 2 && (m.themeProviders[t] / m.providers) >= COACHING.teamShare;
    }).sort(function(a, b){ return m.themeProviders[b] - m.themeProviders[a]; });
    return m;
  }).sort(function(a, b){ return (b.teamPatterns.length - a.teamPatterns.length) || (b.flagRate - a.flagRate); });
}

function computeEscalationStats(notes) {
  var escalated = notes.filter(function(n) { return n.escalated; });
  var resolved = escalated.filter(function(n) { return n.resolved && n.escalated_date && n.resolved_date; });
  var open = escalated.filter(function(n) { return !n.resolved; });

  var resolutionDays = resolved.map(function(n) {
    var ms = new Date(n.resolved_date) - new Date(n.escalated_date);
    return ms / (1000 * 60 * 60 * 24);
  });
  var avgResolutionDays = resolutionDays.length ? (resolutionDays.reduce(function(a, b) { return a + b; }, 0) / resolutionDays.length) : null;

  var openAging = open.map(function(n) {
    var days = n.escalated_date ? (Date.now() - new Date(n.escalated_date)) / (1000 * 60 * 60 * 24) : null;
    return { id: n.id, program: n.program, escalated_date: n.escalated_date, daysOpen: days };
  }).sort(function(a, b) { return (b.daysOpen || 0) - (a.daysOpen || 0); });

  return { totalEscalated: escalated.length, totalResolved: resolved.length, totalOpen: open.length, avgResolutionDays: avgResolutionDays, openAging: openAging };
}

function computeComplianceRollup(notes) {
  var graded = notes.filter(function(n) { return n.compliance_grade; });
  if (!graded.length) return null;
  var byProgram = {};
  graded.forEach(function(n) {
    var key = n.program || '(no program)';
    if (!byProgram[key]) byProgram[key] = { total: 0, compliant: 0, needsImprovement: 0, nonCompliant: 0 };
    byProgram[key].total++;
    if (n.compliance_grade === 'Compliant') byProgram[key].compliant++;
    else if (n.compliance_grade === 'Needs Improvement') byProgram[key].needsImprovement++;
    else if (n.compliance_grade === 'Non-Compliant') byProgram[key].nonCompliant++;
  });
  return { gradedCount: graded.length, totalCount: notes.length, byProgram: byProgram };
}

function renderMonthlyTrendHtml(trend) {
  if (!trend.length) return '<p class="empty-state"><p>No sessions in this window.</p></p>';
  var maxTotal = Math.max.apply(null, trend.map(function(m) { return m.total; }));
  var rows = trend.map(function(m) {
    var w = function(count) { return maxTotal ? Math.max((count / maxTotal) * 100, count > 0 ? 2 : 0) : 0; };
    return `
      <div class="month-row">
        <div class="month-label">${escapeHtml(monthLabel(m.key))}</div>
        <div class="month-bars">
          <div class="month-bar-seg bar-fill bad" style="width:${w(m.concern)}%" title="${m.concern} concern-flagged"></div>
          <div class="month-bar-seg bar-fill warn" style="width:${w(m.aiOnly)}%" title="${m.aiOnly} AI-caught, not self-reported"></div>
          <div class="month-bar-seg bar-fill ok" style="width:${w(m.itp)}%" title="${m.itp} ITP-flagged"></div>
        </div>
        <div class="month-count">${m.total} notes &middot; ${m.concern + m.aiOnly + m.itp} flags</div>
      </div>
    `;
  }).join('');
  return `
    <div class="legend-row">
      <div class="legend-item"><div class="legend-swatch" style="background:var(--bad)"></div>Concern-flagged</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--warn)"></div>AI-caught, not self-reported</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--good)"></div>ITP-flagged</div>
    </div>
    ${rows}
  `;
}

function renderFlagExplainerHtml() {
  var pct = function(x){ return Math.round(x * 100) + '%'; };
  return `
    <details class="flag-explainer">
      <summary>How flags work on this scorecard</summary>
      <p style="margin-top:8px;">A <strong>flag</strong> here means a documentation pattern worth a coaching conversation &mdash; not that the coach reported something. A note is flagged if any of these are true:</p>
      <ul>
        <li><strong>Documentation grade</strong> &mdash; graded Needs Improvement or Non-Compliant against the five UM standards (individualization, goal link to the treatment plan, scope, progress/skill-building, forward plan).</li>
        <li><strong>Repetitive language</strong> &mdash; ${pct(SIM_THRESHOLD)}+ of the note's phrasing matches another note for the <em>same client</em> within ${SIM_WINDOW_DAYS} days (whole note, or Assessment + Plan alone).</li>
        <li><strong>Possible copy-paste</strong> &mdash; the same match, but against a note for a <em>different client</em>.</li>
        <li><strong>Safety concern not self-reported</strong> &mdash; the AI scan found a possible risk in the narrative but the coach didn't toggle the concern flag.</li>
      </ul>
      <p><strong>Not counted as flags:</strong> self-reported concerns and ITP-update flags. Those mean the coach is doing their job; they're shown in the Self-Rep. / ITP columns and the Safety Trend tab.</p>

// ══════════════════════════════════════════════════════════════════
// UTILIZATION vs. SLI SUPPORT LEVEL
// Compares actual peer support hours delivered against the hours/week
// target implied by each client's current SLI 2.0 support level.
// Only note_type='standard' notes count -- BH Linkage (U-code/G-code)
// contacts are a different service model with their own billing
// intensity, not part of the SLI hours/week framework.
// session_length is captured as a range picklist, not a number, so we
// use the midpoint of each range as a reasonable point estimate.
// ══════════════════════════════════════════════════════════════════

var SLI_LEVEL_TARGETS = {
  1: { min: 1, max: 2, label: 'Level 1 (1-2 hrs/wk)' },
  2: { min: 2, max: 4, label: 'Level 2 (2-4 hrs/wk)' },
  3: { min: 4, max: 6, label: 'Level 3 (4-6 hrs/wk)' },
  4: { min: 6, max: 8, label: 'Level 4 (6-8 hrs/wk)' },
  5: { min: 8, max: 12, label: 'Level 5 (8+ hrs/wk)' }
};

function sessionLengthToHours(val) {
  if (!val) return null;
  var map = {
    'less than 1 hour': 0.5,
    '1 to 2 hours': 1.5,
    '2 to 3 hours': 2.5,
    '3 to 4 hours': 3.5
  };
  return map.hasOwnProperty(val) ? map[val] : null;
}

function computeUtilization(notes, sliRows, utilSinceStr, sliHistoryByClient) {
  sliHistoryByClient = sliHistoryByClient || {};
  var sliByClient = {};
  sliRows.forEach(function(r) { if (r.client_number) sliByClient[r.client_number] = r; });

  var hoursByClient = {};
  notes.forEach(function(n) {
    if (n.note_type !== 'standard') return;
    if (!n.session_date || n.session_date < utilSinceStr) return;
    var hrs = sessionLengthToHours(n.session_length);
    if (hrs === null || !n.client_number) return;
    hoursByClient[n.client_number] = (hoursByClient[n.client_number] || 0) + hrs;
  });

  // FIX (BUG-23, 9/4): a client's actual admission date isn't available anywhere this tool can
  // see (no admission_date field on the notes table, no client roster join). Using each client's
  // earliest note in the currently-loaded window (LEADERSHIP_MONTHS_BACK, 9 months back) as a
  // proxy for "on caseload since" — this is exact for a client admitted within that window, and
  // for anyone whose real admission predates it, the 8-week cap below simply never engages (their
  // earliest note in-window is >8 weeks back), so this proxy can only ever make the window
  // *shorter* for someone who's genuinely new to the note history, never wrongly shorten it for a
  // long-standing client. It also fairly handles a client returning after a long gap — that's the
  // same "don't judge by a window that mostly predates them" problem, just for a different reason.
  var earliestByClient = {};
  notes.forEach(function(n) {
    if (!n.client_number || !n.session_date) return;
    if (!earliestByClient[n.client_number] || n.session_date < earliestByClient[n.client_number]) {
      earliestByClient[n.client_number] = n.session_date;
    }
  });
  var utilSinceDate = new Date(utilSinceStr + 'T00:00:00');
  function weeksInWindowFor(client) {
    var earliest = earliestByClient[client];
    if (!earliest) return UTILIZATION_WEEKS_BACK;
    var earliestDate = new Date(earliest + 'T00:00:00');
    if (earliestDate <= utilSinceDate) return UTILIZATION_WEEKS_BACK; // predates the window — full window applies
    var weeksSince = (Date.now() - earliestDate.getTime()) / (1000 * 60 * 60 * 24 * 7);
    return Math.max(1, Math.min(UTILIZATION_WEEKS_BACK, weeksSince)); // floor of 1 week avoids a divide-by-near-zero spike on day one
  }

  var allClientNumbers = {};
  Object.keys(sliByClient).forEach(function(c) { allClientNumbers[c] = true; });
  Object.keys(hoursByClient).forEach(function(c) { allClientNumbers[c] = true; });

  var rows = Object.keys(allClientNumbers).map(function(client) {
    var sli = sliByClient[client];
    var totalHrs = hoursByClient[client] || 0;
    var weeksInWindow = weeksInWindowFor(client);
    var avgWeekly = totalHrs / weeksInWindow;
    var isRecentAdmit = weeksInWindow < UTILIZATION_WEEKS_BACK;
    // BUG-14: last-two-assessment direction for the SLI Trend column, reusing the same
    // helper the Caseload Patterns util_step_down/up detectors use.
    var trend = sliLevelDirection(sliHistoryByClient[client] || []);

    if (!sli) {
      return { client: client, hasSli: false, level: null, targetLabel: null, avgWeekly: avgWeekly, status: 'no_sli', isRecentAdmit: isRecentAdmit, weeksInWindow: weeksInWindow, trend: trend };
    }
    var target = SLI_LEVEL_TARGETS[sli.final_support_level];
    if (!target) {
      return { client: client, hasSli: true, level: sli.final_support_level, targetLabel: '—', avgWeekly: avgWeekly, status: 'no_sli', isRecentAdmit: isRecentAdmit, weeksInWindow: weeksInWindow, trend: trend };
    }
    var status;
    if (avgWeekly === 0) status = 'not_engaged';
    else if (avgWeekly < target.min) status = 'under';
    else if (avgWeekly > target.max) status = 'over';
    else status = 'on_target';

    return { client: client, hasSli: true, level: sli.final_support_level, targetLabel: target.label, targetMin: target.min, targetMax: target.max, avgWeekly: avgWeekly, status: status, isRecentAdmit: isRecentAdmit, weeksInWindow: weeksInWindow, trend: trend };
  });

  // Most actionable first: not engaged, then under, then over, then on target, then no SLI on file.
  var statusOrder = { not_engaged: 0, under: 1, over: 2, on_target: 3, no_sli: 4 };
  rows.sort(function(a, b) {
    var d = statusOrder[a.status] - statusOrder[b.status];
    if (d !== 0) return d;
    return a.client.localeCompare(b.client);
  });

  return rows;
}

function renderUtilizationHtml(rows) {
  if (!rows.length) return '<p class="lead-note">No client activity or SLI assessments found in this window.</p>';

  var STATUS_LABEL = {
    not_engaged: 'Not Engaged', under: 'Under-Served', over: 'Over-Served',
    on_target: 'On Target', no_sli: 'No SLI on File'
  };
  var STATUS_CLASS = {
    not_engaged: 'bad', under: 'warn', over: 'warn', on_target: 'ok', no_sli: 'warn'
  };

  var actionable = rows.filter(function(r) { return r.status !== 'on_target' && r.status !== 'no_sli'; });
  var noSli = rows.filter(function(r) { return r.status === 'no_sli'; });

  var summary = `
    <div class="kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      <div class="kpi bad"><div class="lbl">Not Engaged</div><div class="val">${rows.filter(function(r){return r.status==='not_engaged';}).length}</div></div>
      <div class="kpi warn"><div class="lbl">Under-Served</div><div class="val">${rows.filter(function(r){return r.status==='under';}).length}</div></div>
      <div class="kpi warn"><div class="lbl">Over-Served</div><div class="val">${rows.filter(function(r){return r.status==='over';}).length}</div></div>
      <div class="kpi"><div class="lbl">No SLI on File</div><div class="val">${noSli.length}</div></div>
    </div>
  `;

  if (!actionable.length && !noSli.length) {
    return summary + '<p class="lead-note">Everyone with a current SLI assessment is within their target range. Nice.</p>';
  }

  // BUG-14: last-two-assessment direction, shown next to each client's current target so a
  // manager can see at a glance whether service volume is keeping pace with a changing level.
  function trendCellHtml(r) {
    if (!r.trend) return '<span style="color:var(--muted, #888)">—</span>';
    var arrow = r.trend.direction === 'improving' ? '↓' : '↑';
    var color = r.trend.direction === 'improving' ? 'var(--good, #2a9d5c)' : 'var(--bad, #c0392b)';
    return '<span title="' + escapeHtml((r.trend.prev.assessment_date || '?') + ' → ' + (r.trend.curr.assessment_date || '?')) + '" style="color:' + color + ';font-weight:600;">'
      + 'L' + escapeHtml(String(r.trend.prev.final_support_level)) + ' → L' + escapeHtml(String(r.trend.curr.final_support_level)) + ' ' + arrow
      + '</span>';
  }

  // BUG-23: a client whose earliest note falls inside the averaging window gets a shorter
  // effective window (see computeUtilization) -- flag that here so a low avg/wk doesn't read
  // as "under-served" when it's really just "hasn't been on caseload for the full window yet."
  function clientCellHtml(r) {
    var name = escapeHtml(r.client);
    if (!r.isRecentAdmit) return name;
    return name + ' <span class="badge" title="On caseload ' + Math.round(r.weeksInWindow) + ' of the last ' + UTILIZATION_WEEKS_BACK + ' weeks — average is based on a shorter window" style="font-size:10px;vertical-align:1px;">recent admit</span>';
  }

  var tableRows = actionable.map(function(r) {
    return `
      <tr>
        <td>${clientCellHtml(r)}</td>
        <td>${escapeHtml(r.targetLabel || '—')}</td>
        <td class="num">${r.avgWeekly.toFixed(1)} hrs/wk</td>
        <td>${trendCellHtml(r)}</td>
        <td><span class="badge badge-${STATUS_CLASS[r.status] === 'ok' ? 'reviewed' : (STATUS_CLASS[r.status] === 'bad' ? 'concern' : 'itp')}">${STATUS_LABEL[r.status]}</span></td>
      </tr>
    `;
  }).join('');

  var table = actionable.length ? `
    <table class="lead-table">
      <thead><tr><th>Client</th><th>SLI Target</th><th>Actual (avg/wk)</th><th>SLI Trend</th><th>Status</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  ` : '<p class="lead-note">No under- or over-served clients right now among those with a current SLI on file.</p>';

  var noSliNote = noSli.length
    ? '<div class="lead-note" style="margin-top:10px;">' + noSli.length + ' client(s) with recent session activity have no current SLI assessment on file: ' + noSli.map(function(r){ return escapeHtml(r.client); }).join(', ') + '. Per the SLI 2.0 manual, an initial assessment should exist for anyone receiving peer support services.</div>'
    : '';

  return summary + table + noSliNote;
}

var leadershipSubTab = 'utilization';
var leadershipData = null; // cached computed sections so switching sub-tabs doesn't recompute

function renderLeadershipDashboard(notes, sliRows, utilSinceStr, sliHistoryByClient, simMap, coachSinceStr) {
  var container = document.getElementById('leadershipMode');
  var coachingNotes = coachSinceStr ? notes.filter(function(n){ return n.session_date && n.session_date >= coachSinceStr; }) : notes;
  leadershipData = {
    trend: computeMonthlyTrend(notes),
    scorecard: computeProviderScorecard(coachingNotes, simMap || {}),
    escStats: computeEscalationStats(notes),
    compliance: computeComplianceRollup(notes),
    utilization: computeUtilization(notes, sliRows || [], utilSinceStr, sliHistoryByClient || {})
  };

  var openEscCount = (leadershipData.escStats.totalOpen || 0);
  var utilFlagCount = leadershipData.utilization.filter(function(r){ return r.status === 'not_engaged' || r.status === 'under' || r.status === 'over'; }).length;
  var providerSupportCount = leadershipData.scorecard.filter(function(p){ return p.reasons.length; }).length;
  var complianceFlagCount = notes.filter(function(n){ return n.compliance_grade === 'Needs Improvement' || n.compliance_grade === 'Non-Compliant'; }).length;

  container.innerHTML = `
    <div class="mode-toggle" style="margin-bottom:20px;">
      <div class="mode-tab lead-sub-tab" data-leadtab="utilization">Utilization${utilFlagCount ? ' <span class="count">' + utilFlagCount + '</span>' : ''}</div>
      <div class="mode-tab lead-sub-tab" data-leadtab="safety">Safety Trend</div>

      <div class="mode-tab lead-sub-tab" data-leadtab="compliance">Compliance${complianceFlagCount ? ' <span class="count">' + complianceFlagCount + '</span>' : ''}</div>

        ${currentReviewer.role === 'org_wide' ? '<div style="margin:-4px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><button class="refresh-btn" id="gradeBatchBtn" title="Grade the 25 oldest ungraded notes now">Grade oldest 25 now</button><span id="gradeBatchStatus" class="lead-section-sub" style="margin:0;">' + escapeHtml(lastBackfillMsg) + '</span></div>' : ''}

        <div class="lead-section-title">Coaching Scorecard</div>
        <div class="lead-section-sub">Last ${COACHING.windowDays} days. A supervision and coaching lens &mdash; where a coach or a whole team could use support with documentation &mdash; not a compliance scoreboard.</div>
        ${renderProviderScorecardHtml(d.scorecard)}
      </div>
    `;
  }
  el.innerHTML = html;
  if (leadershipSubTab === 'providers') bindProviderScorecard();
  var gb = document.getElementById('gradeBatchBtn');
  if (gb) gb.onclick = gradeNextBatch;
}

// Close any open Escalate menu when clicking elsewhere.
document.addEventListener('click', function(e) {
  document.querySelectorAll('details.nc-menu[open]').forEach(function(d){ if (!d.contains(e.target)) d.removeAttribute('open'); });
});

// ── INIT ──
(async function init() {
  var { data } = await sb.auth.getSession();
  if (data && data.session) {
    var reviewerLookup = await sb.from('reviewers').select('name, role, divisions, email').eq('id', data.session.user.id).single();
    if (!reviewerLookup.error && reviewerLookup.data) {
      currentReviewer = reviewerLookup.data;
      await attachRosterScope(currentReviewer, data.session.user.id);
      await loadAndRenderDashboard();
      return;
    }
  }
  renderLogin();
})();
</script>
</body>
