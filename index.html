  return summary + `<div class="lead-table" style="padding:0;">${items}</div>`;
}

function renderComplianceRollupHtml(rollup) {
  if (!rollup) {
    return '<p class="lead-note">Compliance grading isn\'t populated in this data yet &mdash; the <code>compliance_grade</code> field is empty on every note in this window. Once the grading pass has been run (or is running automatically on new notes), this section will show Compliant / Needs Improvement / Non-Compliant rates by program.</p>';
  }
  var rows = Object.keys(rollup.byProgram).map(function(program) {
    var p = rollup.byProgram[program];
    var compliantPct = p.total ? (p.compliant / p.total * 100) : 0;
    return `
      <tr>
        <td>${escapeHtml(program)}</td>
        <td class="num">${p.total}</td>
        <td class="num">${p.compliant}</td>
        <td class="num">${p.needsImprovement}</td>
        <td class="num">${p.nonCompliant}</td>
        <td style="min-width:120px;"><div class="bar-track"><div class="bar-fill ${compliantPct >= 80 ? 'ok' : compliantPct >= 60 ? 'warn' : 'bad'}" style="width:${compliantPct}%"></div></div></td>
      </tr>
    `;
  }).join('');
  return `
    <div class="lead-section-sub">${rollup.gradedCount} of ${rollup.totalCount} notes in this window have been graded.</div>
    <table class="lead-table">
      <thead><tr>
        <th>Program</th><th>Graded</th><th>Compliant</th><th>Needs Improvement</th><th>Non-Compliant</th><th>Compliant %</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// ══════════════════════════════════════════════════════════════════
// UTILIZATION vs. SLI SUPPORT LEVEL
// Compares actual peer support hours delivered against the hours/week
// target implied by each client's current SLI 2.0 support level.
// Only note_type='standard' notes count -- BH Linkage (U-code/G-code)
// contacts are a different service model with their own billing
// intensity, not part of the SLI hours/week framework.
// session_length is captured as a range picklist, not a number, so we
// use the midpoint of each range as a reasonable point estimate.
// ══════════════════════════════════════════════════════════════════

var SLI_LEVEL_TARGETS = {
  1: { min: 1, max: 2, label: 'Level 1 (1-2 hrs/wk)' },
  2: { min: 2, max: 4, label: 'Level 2 (2-4 hrs/wk)' },
  3: { min: 4, max: 6, label: 'Level 3 (4-6 hrs/wk)' },
  4: { min: 6, max: 8, label: 'Level 4 (6-8 hrs/wk)' },
  5: { min: 8, max: 12, label: 'Level 5 (8+ hrs/wk)' }
};

function sessionLengthToHours(val) {
  if (!val) return null;
  var map = {
    'less than 1 hour': 0.5,
    '1 to 2 hours': 1.5,
    '2 to 3 hours': 2.5,
    '3 to 4 hours': 3.5
  };
  return map.hasOwnProperty(val) ? map[val] : null;
}

function computeUtilization(notes, sliRows, utilSinceStr, sliHistoryByClient) {
  sliHistoryByClient = sliHistoryByClient || {};
  var sliByClient = {};
  sliRows.forEach(function(r) { if (r.client_number) sliByClient[r.client_number] = r; });

  var hoursByClient = {};
  notes.forEach(function(n) {
    if (n.note_type !== 'standard') return;
    if (!n.session_date || n.session_date < utilSinceStr) return;
    var hrs = sessionLengthToHours(n.session_length);
    if (hrs === null || !n.client_number) return;
    hoursByClient[n.client_number] = (hoursByClient[n.client_number] || 0) + hrs;
  });

  // FIX (BUG-23, 9/4): a client's actual admission date isn't available anywhere this tool can
  // see (no admission_date field on the notes table, no client roster join). Using each client's
  // earliest note in the currently-loaded window (LEADERSHIP_MONTHS_BACK, 9 months back) as a
  // proxy for "on caseload since" — this is exact for a client admitted within that window, and
  // for anyone whose real admission predates it, the 8-week cap below simply never engages (their
  // earliest note in-window is >8 weeks back), so this proxy can only ever make the window
  // *shorter* for someone who's genuinely new to the note history, never wrongly shorten it for a
  // long-standing client. It also fairly handles a client returning after a long gap — that's the
  // same "don't judge by a window that mostly predates them" problem, just for a different reason.
  var earliestByClient = {};
  notes.forEach(function(n) {
    if (!n.client_number || !n.session_date) return;
    if (!earliestByClient[n.client_number] || n.session_date < earliestByClient[n.client_number]) {
      earliestByClient[n.client_number] = n.session_date;
    }
  });
  var utilSinceDate = new Date(utilSinceStr + 'T00:00:00');
  function weeksInWindowFor(client) {
    var earliest = earliestByClient[client];
    if (!earliest) return UTILIZATION_WEEKS_BACK;
    var earliestDate = new Date(earliest + 'T00:00:00');
    if (earliestDate <= utilSinceDate) return UTILIZATION_WEEKS_BACK; // predates the window — full window applies
    var weeksSince = (Date.now() - earliestDate.getTime()) / (1000 * 60 * 60 * 24 * 7);
    return Math.max(1, Math.min(UTILIZATION_WEEKS_BACK, weeksSince)); // floor of 1 week avoids a divide-by-near-zero spike on day one
  }

  var allClientNumbers = {};
  Object.keys(sliByClient).forEach(function(c) { allClientNumbers[c] = true; });
  Object.keys(hoursByClient).forEach(function(c) { allClientNumbers[c] = true; });

  var rows = Object.keys(allClientNumbers).map(function(client) {
    var sli = sliByClient[client];
    var totalHrs = hoursByClient[client] || 0;
    var weeksInWindow = weeksInWindowFor(client);
    var avgWeekly = totalHrs / weeksInWindow;
    var isRecentAdmit = weeksInWindow < UTILIZATION_WEEKS_BACK;
    // BUG-14: last-two-assessment direction for the SLI Trend column, reusing the same
    // helper the Caseload Patterns util_step_down/up detectors use.
    var trend = sliLevelDirection(sliHistoryByClient[client] || []);

    if (!sli) {
      return { client: client, hasSli: false, level: null, targetLabel: null, avgWeekly: avgWeekly, status: 'no_sli', isRecentAdmit: isRecentAdmit, weeksInWindow: weeksInWindow, trend: trend };
    }
    var target = SLI_LEVEL_TARGETS[sli.final_support_level];
    if (!target) {
      return { client: client, hasSli: true, level: sli.final_support_level, targetLabel: '—', avgWeekly: avgWeekly, status: 'no_sli', isRecentAdmit: isRecentAdmit, weeksInWindow: weeksInWindow, trend: trend };
    }
    var status;
    if (avgWeekly === 0) status = 'not_engaged';
    else if (avgWeekly < target.min) status = 'under';
    else if (avgWeekly > target.max) status = 'over';
    else status = 'on_target';

    return { client: client, hasSli: true, level: sli.final_support_level, targetLabel: target.label, targetMin: target.min, targetMax: target.max, avgWeekly: avgWeekly, status: status, isRecentAdmit: isRecentAdmit, weeksInWindow: weeksInWindow, trend: trend };
  });

  // Most actionable first: not engaged, then under, then over, then on target, then no SLI on file.
  var statusOrder = { not_engaged: 0, under: 1, over: 2, on_target: 3, no_sli: 4 };
  rows.sort(function(a, b) {
    var d = statusOrder[a.status] - statusOrder[b.status];
    if (d !== 0) return d;
    return a.client.localeCompare(b.client);
  });

  return rows;
}

function renderUtilizationHtml(rows) {
  if (!rows.length) return '<p class="lead-note">No client activity or SLI assessments found in this window.</p>';

  var STATUS_LABEL = {
    not_engaged: 'Not Engaged', under: 'Under-Served', over: 'Over-Served',
    on_target: 'On Target', no_sli: 'No SLI on File'
  };
  var STATUS_CLASS = {
    not_engaged: 'bad', under: 'warn', over: 'warn', on_target: 'ok', no_sli: 'warn'
  };

  var actionable = rows.filter(function(r) { return r.status !== 'on_target' && r.status !== 'no_sli'; });
  var noSli = rows.filter(function(r) { return r.status === 'no_sli'; });

  var summary = `
    <div class="kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      <div class="kpi bad"><div class="lbl">Not Engaged</div><div class="val">${rows.filter(function(r){return r.status==='not_engaged';}).length}</div></div>
      <div class="kpi warn"><div class="lbl">Under-Served</div><div class="val">${rows.filter(function(r){return r.status==='under';}).length}</div></div>
      <div class="kpi warn"><div class="lbl">Over-Served</div><div class="val">${rows.filter(function(r){return r.status==='over';}).length}</div></div>
      <div class="kpi"><div class="lbl">No SLI on File</div><div class="val">${noSli.length}</div></div>
    </div>
  `;

  if (!actionable.length && !noSli.length) {
    return summary + '<p class="lead-note">Everyone with a current SLI assessment is within their target range. Nice.</p>';
  }

  // BUG-14: last-two-assessment direction, shown next to each client's current target so a
  // manager can see at a glance whether service volume is keeping pace with a changing level.
  function trendCellHtml(r) {
    if (!r.trend) return '<span style="color:var(--muted, #888)">—</span>';
    var arrow = r.trend.direction === 'improving' ? '↓' : '↑';
    var color = r.trend.direction === 'improving' ? 'var(--good, #2a9d5c)' : 'var(--bad, #c0392b)';
    return '<span title="' + escapeHtml((r.trend.prev.assessment_date || '?') + ' → ' + (r.trend.curr.assessment_date || '?')) + '" style="color:' + color + ';font-weight:600;">'
      + 'L' + escapeHtml(String(r.trend.prev.final_support_level)) + ' → L' + escapeHtml(String(r.trend.curr.final_support_level)) + ' ' + arrow
      + '</span>';
  }

  // BUG-23: a client whose earliest note falls inside the averaging window gets a shorter
  // effective window (see computeUtilization) -- flag that here so a low avg/wk doesn't read
  // as "under-served" when it's really just "hasn't been on caseload for the full window yet."
  function clientCellHtml(r) {
    var name = escapeHtml(r.client);
    if (!r.isRecentAdmit) return name;
    return name + ' <span class="badge" title="On caseload ' + Math.round(r.weeksInWindow) + ' of the last ' + UTILIZATION_WEEKS_BACK + ' weeks — average is based on a shorter window" style="font-size:10px;vertical-align:1px;">recent admit</span>';
  }

  var tableRows = actionable.map(function(r) {
    return `
      <tr>
        <td>${clientCellHtml(r)}</td>
        <td>${escapeHtml(r.targetLabel || '—')}</td>
        <td class="num">${r.avgWeekly.toFixed(1)} hrs/wk</td>
        <td>${trendCellHtml(r)}</td>
        <td><span class="badge badge-${STATUS_CLASS[r.status] === 'ok' ? 'reviewed' : (STATUS_CLASS[r.status] === 'bad' ? 'concern' : 'itp')}">${STATUS_LABEL[r.status]}</span></td>
      </tr>
    `;
  }).join('');

  var table = actionable.length ? `
    <table class="lead-table">
      <thead><tr><th>Client</th><th>SLI Target</th><th>Actual (avg/wk)</th><th>SLI Trend</th><th>Status</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  ` : '<p class="lead-note">No under- or over-served clients right now among those with a current SLI on file.</p>';

  var noSliNote = noSli.length
    ? '<div class="lead-note" style="margin-top:10px;">' + noSli.length + ' client(s) with recent session activity have no current SLI assessment on file: ' + noSli.map(function(r){ return escapeHtml(r.client); }).join(', ') + '. Per the SLI 2.0 manual, an initial assessment should exist for anyone receiving peer support services.</div>'
    : '';

  return summary + table + noSliNote;
}

var leadershipSubTab = 'utilization';
var leadershipData = null; // cached computed sections so switching sub-tabs doesn't recompute

function renderLeadershipDashboard(notes, sliRows, utilSinceStr, sliHistoryByClient) {
  var container = document.getElementById('leadershipMode');
  leadershipData = {
    trend: computeMonthlyTrend(notes),
    scorecard: computeProviderScorecard(notes),
    escStats: computeEscalationStats(notes),
    compliance: computeComplianceRollup(notes),
    utilization: computeUtilization(notes, sliRows || [], utilSinceStr, sliHistoryByClient || {})
  };

  var openEscCount = (leadershipData.escStats.totalOpen || 0);
  var utilFlagCount = leadershipData.utilization.filter(function(r){ return r.status === 'not_engaged' || r.status === 'under' || r.status === 'over'; }).length;
  var complianceFlagCount = notes.filter(function(n){ return n.compliance_grade === 'Needs Improvement' || n.compliance_grade === 'Non-Compliant'; }).length;

  container.innerHTML = `
    <div class="mode-toggle" style="margin-bottom:20px;">
      <div class="mode-tab lead-sub-tab" data-leadtab="utilization">Utilization${utilFlagCount ? ' <span class="count">' + utilFlagCount + '</span>' : ''}</div>
      <div class="mode-tab lead-sub-tab" data-leadtab="safety">Safety Trend</div>
      <div class="mode-tab lead-sub-tab" data-leadtab="escalations">Escalations${openEscCount ? ' <span class="count">' + openEscCount + '</span>' : ''}</div>
      <div class="mode-tab lead-sub-tab" data-leadtab="compliance">Compliance${complianceFlagCount ? ' <span class="count">' + complianceFlagCount + '</span>' : ''}</div>
      <div class="mode-tab lead-sub-tab" data-leadtab="providers">Provider Scorecard</div>
    </div>
    <div id="leadSubContent"></div>
  `;

  document.querySelectorAll('.lead-sub-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.getAttribute('data-leadtab') === leadershipSubTab);
    tab.onclick = function() {
      leadershipSubTab = tab.getAttribute('data-leadtab');
      renderLeadershipSubContent();
    };
  });

  renderLeadershipSubContent();
}

function renderLeadershipSubContent() {
  var el = document.getElementById('leadSubContent');
  if (!el || !leadershipData) return;
  document.querySelectorAll('.lead-sub-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.getAttribute('data-leadtab') === leadershipSubTab);
  });

  var d = leadershipData;
  var html = '';
  if (leadershipSubTab === 'utilization') {
    html = `
      <div class="lead-section">
        <div class="lead-section-title">Utilization vs. SLI Support Level</div>
        <div class="lead-section-sub">Actual peer support hours (standard notes only, ${UTILIZATION_WEEKS_BACK}-week average) against each client's current SLI-assigned target. Point estimates from session length ranges &mdash; a signal to check, not a precise measurement.</div>
        ${renderUtilizationHtml(d.utilization)}
      </div>
    `;
  } else if (leadershipSubTab === 'safety') {
    html = `
      <div class="lead-section">
        <div class="lead-section-title">Safety &amp; Concern Trend</div>
        <div class="lead-section-sub">Last ${LEADERSHIP_MONTHS_BACK} months, by session date. Watch the amber (AI-caught, not self-reported) segment especially &mdash; that's the gap the safety-net scan exists to close.</div>
        ${renderMonthlyTrendHtml(d.trend)}
      </div>
    `;
  } else if (leadershipSubTab === 'escalations') {
    html = `
      <div class="lead-section">
        <div class="lead-section-title">Clinical Director Hub — Escalation Resolution</div>
        <div class="lead-section-sub">Time from escalation to being marked resolved in the Clinical Director Hub's Escalated Charts queue. Anything open past 7 days shows in red below.</div>
        ${renderEscalationAgingHtml(d.escStats)}
      </div>
    `;
  } else if (leadershipSubTab === 'compliance') {
    html = `
      <div class="lead-section">
        <div class="lead-section-title">Documentation Compliance by Program</div>
        <div class="lead-section-sub">Every note graded against the UM framework standards, not just flagged ones.</div>
        ${renderComplianceRollupHtml(d.compliance)}
      </div>
    `;
  } else if (leadershipSubTab === 'providers') {
    html = `
      <div class="lead-section">
        <div class="lead-section-title">Provider Scorecard</div>
        <div class="lead-section-sub">Flag rate and escalation history by PRS, last ${LEADERSHIP_MONTHS_BACK} months. Meant as a supervision lens &mdash; who needs support, not a scoreboard.</div>
        ${renderProviderScorecardHtml(d.scorecard)}
      </div>
    `;
  }
  el.innerHTML = html;
}

// ── INIT ──
(async function init() {
  var { data } = await sb.auth.getSession();
  if (data && data.session) {
    var reviewerLookup = await sb.from('reviewers').select('name, role, divisions, email').eq('id', data.session.user.id).single();
    if (!reviewerLookup.error && reviewerLookup.data) {
      currentReviewer = reviewerLookup.data;
      await attachRosterScope(currentReviewer, data.session.user.id);
      await loadAndRenderDashboard();
      return;
    }
  }
  renderLogin();
})();
</script>
</body>
</html>
